ated or orphaned data."], "tryItYourself": "<p>Connect your Lesson 13 product API to a real PostgreSQL database via Prisma, replacing your in-memory array with real persisted data, using a proper migration.</p>", "assignment": "<p>Build a second small API — a blog with posts and embedded comments — using MongoDB/Mongoose, so you can directly compare the modeling experience against the relational version.</p>", "checkYourself": ["Could you explain, with a real example, when you'd choose SQL over NoSQL?", "Do you understand what a migration is, and why it matters for team collaboration?"], "goFurther": ["Prisma official docs", "MongoDB University free courses (M001)"]}, {"number": 15, "title": "REST API Design & Authentication", "whatYoullLearn": ["How to design a clean, conventional REST API", "How to securely handle passwords and log users in with JWT", "How to protect specific routes so only the right people can access them"], "whyThisMatters": "<p>Sloppy API design and weak authentication are two of the fastest ways to look junior in a code review — and two of the most common real security incidents in the industry. This lesson is non-negotiable.</p>", "lessonContent": "<p>Learn <strong>REST conventions</strong>: resource-based URLs (<code>/api/products/:id</code>, never <code>/api/getProduct</code>), the correct HTTP verb for each action (GET, POST, PUT/PATCH, DELETE), and correct status codes (200, 201, 400, 401, 403, 404, 500).</p><p>Implement real <strong>authentication</strong>: hash every password with <code>bcrypt</code> — never, under any circumstance, store a plaintext password — and use <strong>JWT (JSON Web Tokens)</strong> for stateless session management:</p><pre class=\"code-block\" data-lang=\"js\"><code>const hashedPassword = await bcrypt.hash(password, 10);\n\nconst token = jwt.sign({ userId: user.id }, process.env.JWT_SECRET, {\n  expiresIn: &quot;1h&quot;,\n});</code></pre><p>Build <strong>protected routes</strong> with authentication middleware that verifies the token before allowing access:</p><pre class=\"code-block\" data-lang=\"js\"><code>function authMiddleware(req, res, next) {\n  const token = req.headers.authorization?.split(&quot; &quot;)[1];\n  if (!token) return res.status(401).json({ error: &quot;No token provided&quot; });\n  try {\n    req.user = jwt.verify(token, process.env.JWT_SECRET);\n    next();\n  } catch {\n    res.status(401).json({ error: &quot;Invalid token&quot; });\n  }\n}</code></pre><p>Learn the concept of <strong>refresh tokens</strong>: a short-lived access token (minutes to an hour) paired with a longer-lived refresh token, so users aren't forced to constantly re-login while you still limit the damage window if an access token is ever stolen. Briefly understand <strong>OAuth</strong> conceptually — how \"Login with Google\" works without your app ever seeing the user's actual Google password.</p>", "keyTerms": ["REST", "JWT", "access token", "refresh token", "bcrypt", "OAuth"], "mistakes": ["Storing plaintext or weakly hashed passwords.", "Putting sensitive data inside a JWT payload — remember, a JWT is only encoded, not encrypted; anyone can read its contents.", "Never expiring tokens, or using a weak JWT secret (or worse, committing it to source control).", "Inconsistent status codes across different endpoints."], "tryItYourself": "<p>Add signup/login endpoints to your product API, with password hashing and JWT issuance, and protect the \"create product\" endpoint so only logged-in users can access it.</p>", "assignment": "<p>Add role-based access (an \"admin\" vs. \"customer\" distinction) so only admins can delete products, using the same auth middleware pattern.</p>", "checkYourself": ["Could you explain, without notes, why you never store plaintext passwords?", "Do you understand what's actually inside a JWT, and why that means it shouldn't hold secrets?"], "goFurther": ["jwt.io (JWT debugger and explanation)", "OWASP Authentication Cheat Sheet"]}, {"number": 16, "title": "Connecting Your Frontend to Your Backend", "whatYoullLearn": ["How to wire your React app to your real Express API", "How to solve CORS — the roadblock almost everyone hits first", "How to build a UI that feels responsive even while waiting on the network"], "whyThisMatters": "<p>This is the lesson where your project stops being \"a frontend demo\" and \"a backend demo\" and becomes one real, working application.</p>", "lessonContent": "<p>Connect your React app (Lessons 10–12) to your Express API (Lessons 13–15). You'll almost certainly hit <strong>CORS</strong> first — your frontend and backend run on different ports during development, and browsers block cross-origin requests by default unless the server explicitly allows them:</p><pre class=\"code-block\" data-lang=\"js\"><code>app.use(cors({ origin: &quot;http://localhost:5173&quot;, credentials: true }));</code></pre><p>Store your JWT securely on the client — prefer httpOnly cookies over <code>localStorage</code> where possible, and understand the real security trade-off between the two (<code>localStorage</code> is readable by any JavaScript running on your page, which matters if you're ever vulnerable to XSS).</p><pre class=\"code-block\" data-lang=\"jsx\"><code>async function createProduct(product) {\n  const response = await fetch(&quot;/api/products&quot;, {\n    method: &quot;POST&quot;,\n    headers: { &quot;Content-Type&quot;: &quot;application/json&quot;, Authorization: `Bearer ${token}` },\n    body: JSON.stringify(product),\n  });\n  if (!response.ok) throw new Error(&quot;Failed to create product&quot;);\n  return response.json();\n}</code></pre><p>Learn <strong>optimistic UI updates</strong> — updating the interface immediately, before the server even confirms, then rolling back if something fails. This is a real technique that makes apps <em>feel</em> fast. Add loading and error states everywhere a request happens, and mirror your client-side form validation with server-side validation — remember, client-side validation is a UX nicety; server-side is the real security boundary.</p>", "keyTerms": ["CORS", "httpOnly cookie", "optimistic update", "client/server validation parity"], "mistakes": ["Trusting client-side validation alone and skipping server-side checks.", "Storing JWTs in <code>localStorage</code> without understanding the trade-off.", "Skipping loading/error states, leaving the UI silently broken whenever a request fails."], "tryItYourself": "<p>Fully connect your React product catalog UI to your real backend: list, create, edit, delete products, with login gating the create/edit/delete actions.</p>", "assignment": "<p>Add real UX polish across the whole app: loading spinners, error messages, and disabled buttons during in-flight requests.</p>", "checkYourself": ["Could you explain what CORS is, and why it exists, to a frustrated classmate hitting it for the first time?", "Does every part of your app handle a failed request gracefully, or does anything just silently break?"], "goFurther": ["MDN docs on CORS", "\"Storing JWTs\" (Auth0 blog, comparison of storage options)"]}, {"number": 17, "title": "Testing Your Application", "whatYoullLearn": ["How to write real unit tests with Jest", "How to test your API endpoints systematically with Postman", "Why untested code is a real liability, not just a nice-to-have"], "whyThisMatters": "<p>Employers actively screen for testing habits in code review. Untested code is exactly the kind of thing that quietly breaks in production and gets traced back to whoever shipped it.</p>", "lessonContent": "<p>Learn <strong>Jest</strong> for unit testing your logic and React components, alongside React Testing Library, which pushes you to test behavior a user would actually see — not internal implementation details:</p><pre class=\"code-block\" data-lang=\"js\"><code>function calculateTotal(items) {\n  return items.reduce((sum, item) =&gt; sum + item.price, 0);\n}\n\ntest(&quot;calculates total price correctly&quot;, () =&gt; {\n  expect(calculateTotal([{ price: 10 }, { price: 20 }])).toBe(30);\n});</code></pre><pre class=\"code-block\" data-lang=\"jsx\"><code>test(&quot;renders greeting with name&quot;, () =&gt; {\n  render(&lt;Greeting name=&quot;Sharon&quot; /&gt;);\n  expect(screen.getByText(&quot;Sharon: 0&quot;)).toBeInTheDocument();\n});</code></pre><p>Learn <strong>Postman</strong> for manually and semi-automatically testing your API — building request collections, checking status codes and response shapes, and organizing environments (dev/staging/prod variables) the way real teams do.</p><p>Hold onto the <strong>testing pyramid</strong> as a mental model going forward: many fast unit tests, fewer integration tests, very few slow end-to-end tests. It's a guide for where to spend your testing effort as your projects grow.</p>", "keyTerms": ["unit test", "assertion", "test coverage", "testing pyramid", "Postman collection/environment"], "mistakes": ["Testing implementation details instead of observable behavior.", "Writing zero tests until \"later\" — later rarely comes.", "Writing only happy-path tests, with no error-case coverage at all."], "tryItYourself": "<p>Write unit tests for your cart total calculation and product filtering logic, plus a Postman collection covering every endpoint of your product API (happy path + at least one error case each).</p>", "assignment": "<p>Reach test coverage on every \"pure logic\" function in your project (non-UI calculations/validations), and submit your Postman collection as a shareable export.</p>", "checkYourself": ["Could you explain the testing pyramid, and why it's shaped that way?", "Does your API have a Postman collection covering both success and failure cases?"], "goFurther": ["Jest official documentation", "React Testing Library docs", "Postman Learning Center"]}], "project": {"lead": "Choose a domain (task manager, e-commerce catalog, blog platform, booking system) and build a complete application including:", "build": ["A React frontend with routing and shared state, in TypeScript (Lessons 10–12)", "An Express/Node backend with clean MVC structure (Lesson 13)", "A real, persisted database — SQL or NoSQL, justified by your data's shape (Lesson 14)", "Full authentication with hashed passwords and JWT, with at least one role-based restriction (Lesson 15)", "Fully connected frontend/backend CRUD flows with proper loading/error handling (Lesson 16)", "Unit tests for your core logic, plus a full Postman collection (Lesson 17)", "A live deployment — frontend, backend, and database all running for real"], "assess": "Full stack integration &amp; functionality (25%) · Authentication &amp; security correctness (20%) · Database design appropriateness (15%) · Code architecture (20%) · Testing coverage (10%) · Deployment &amp; documentation (10%)", "extra": "", "title": "A Full CRUD Application with Authentication"}}, {"id": "stage3", "number": 3, "name": "Advanced", "range": "Weeks 17–24", "subtitle": "Production-Grade Engineering", "blurb": "System design, DevOps, security, and a capstone SaaS product you'll defend live.", "icon": "tree", "intro": "<p>By the end of this stage, you'll be able to architect, secure, scale, and deploy a real SaaS product — and defend your technical decisions the way a professional engineer would in an interview.</p>", "lessons": [{"number": 18, "title": "GraphQL — Querying Exactly What You Need", "whatYoullLearn": ["What GraphQL solves that REST doesn't", "How to design a schema and write resolvers", "When GraphQL is actually the better choice — and when REST still wins"], "whyThisMatters": "", "lessonContent": "<p>REST (Stage 2) returns a fixed data shape per endpoint, which often means over-fetching (getting fields you don't need) or under-fetching (needing several round trips to assemble what you actually want). <strong>GraphQL</strong> lets your client specify exactly what it wants, in a single request:</p><pre class=\"code-block\" data-lang=\"graphql\"><code>type Book {\n  id: ID!\n  title: String!\n  author: Author!\n}\n\ntype Query {\n  book(id: ID!): Book\n  books: [Book!]!\n}</code></pre><p>Learn <strong>schemas</strong> (your data contract), <strong>resolvers</strong> (functions that fetch each field's actual data), and the difference between <strong>queries</strong> (reads) and <strong>mutations</strong> (writes):</p><pre class=\"code-block\" data-lang=\"js\"><code>const resolvers = {\n  Query: {\n    book: (_, { id }) =&gt; db.books.find(b =&gt; b.id === id),\n    books: () =&gt; db.books.findAll(),\n  },\n  Mutation: {\n    addBook: (_, { title, authorId }) =&gt; db.books.create({ title, authorId }),\n  },\n};</code></pre><p>Use <strong>Apollo Client</strong> on the frontend and Apollo Server on the backend. Watch for the <strong>N+1 query problem</strong> in GraphQL specifically — a list query triggering one resolver call per item — and its standard fix, <strong>DataLoader</strong>, which batches and caches resolver calls within a single request.</p><p>This is genuinely a trade-off decision, not \"GraphQL is strictly better\": it shines for complex, nested, client-driven data needs (mobile apps, dashboards); REST stays simpler and often preferable for straightforward CRUD services.</p>", "keyTerms": ["schema", "resolver", "query", "mutation", "over/under-fetching", "N+1 problem", "DataLoader"], "mistakes": [], "tryItYourself": "<p>Convert 3 endpoints of your Stage 2 product API into a GraphQL schema with resolvers, and query it via Apollo's built-in playground.</p>", "assignment": "<p>Build one React component that fetches nested data (a book with its author and reviews) in a single GraphQL query, and compare the number of network requests to the equivalent REST version.</p>", "checkYourself": ["Could you explain, with a concrete example, when you'd choose GraphQL over REST for a new project?"], "goFurther": ["GraphQL official documentation (graphql.org)", "Apollo Client/Server official docs"]}, {"number": 19, "title": "Advanced React Performance & Next.js", "whatYoullLearn": ["How to make React apps genuinely fast, not just functional", "How Next.js solves problems plain React can't", "How to choose the right rendering strategy for each page"], "whyThisMatters": "", "lessonContent": "<p>Learn performance optimization tools: <code>React.memo</code> (skip re-rendering a component when its props haven't changed), <code>useMemo</code>/<code>useCallback</code> (memoize expensive calculations and function references), and <strong>code splitting</strong> with <code>React.lazy</code>/<code>Suspense</code>, so users only download the code they actually need:</p><pre class=\"code-block\" data-lang=\"jsx\"><code>const AdminPanel = React.lazy(() =&gt; import(&quot;./AdminPanel&quot;));\n\n&lt;Suspense fallback={&lt;Spinner /&gt;}&gt;\n  &lt;AdminPanel /&gt;\n&lt;/Suspense&gt;</code></pre><p>Meet <strong>Next.js</strong>, a production-grade React framework that solves what plain React (client-side only) can't: <strong>SSR</strong> (Server-Side Rendering — HTML generated per request, better for SEO and first load), <strong>SSG</strong> (Static Site Generation — HTML generated at build time, extremely fast for content that doesn't change often), and <strong>ISR</strong> (Incremental Static Regeneration — static pages that regenerate periodically without a full rebuild).</p><pre class=\"code-block\" data-lang=\"jsx\"><code>export default async function ProductPage({ params }) {\n  const product = await fetchProduct(params.id); // runs on the server\n  return &lt;ProductDetail product={product} /&gt;;\n}</code></pre><p>Practice the actual decision: a marketing page → SSG; a dashboard with constantly changing per-user data → client-side or SSR; a product catalog updating hourly → ISR. Learn the difference between <strong>Server Components</strong> (the default in Next's App Router) and <strong>Client Components</strong> (<code>\"use client\"</code>, only when you genuinely need interactivity, hooks, or browser APIs).</p>", "keyTerms": ["memoization", "code splitting", "SSR", "SSG", "ISR", "Server Component", "Client Component"], "mistakes": [], "tryItYourself": "<p>Migrate your Stage 2 project's product listing page to Next.js using SSG, and the user dashboard page using SSR — and be ready to explain your rendering choice for each.</p>", "assignment": "<p>Profile your app using React DevTools Profiler, find one unnecessary re-render, and fix it with <code>memo</code>/<code>useMemo</code>.</p>", "checkYourself": ["Could you explain, for any given page in a real app, which rendering strategy you'd choose and why?"], "goFurther": ["Next.js official documentation (\"Learn Next.js\")", "React docs on performance (\"Render and Commit\")"]}, {"number": 20, "title": "System Design for Web Applications", "whatYoullLearn": ["How to reason about scale, not just correctness", "The core tools real systems use to stay fast under load: caching, load balancing, CDNs", "The framework used in real system design interviews"], "whyThisMatters": "", "lessonContent": "<p>System design thinking is the shift from \"does it work\" to \"does it work under load, for many users, reliably.\" Learn <strong>horizontal vs. vertical scaling</strong> (more machines vs. bigger machines), <strong>load balancing</strong> (spreading traffic across multiple servers), and <strong>caching</strong> — storing frequently accessed data somewhere fast (Redis, a CDN) so your database isn't hit on every single request:</p><pre class=\"code-block\" data-lang=\"js\"><code>async function getProduct(id) {\n  const cached = await redis.get(`product:${id}`);\n  if (cached) return JSON.parse(cached);\n\n  const product = await db.products.findById(id);\n  await redis.set(`product:${id}`, JSON.stringify(product), &quot;EX&quot;, 3600);\n  return product;\n}</code></pre><p>Learn what <strong>CDNs</strong> do (serving static assets from servers geographically close to your users) and basic database <strong>replication</strong> (read replicas, for scaling read-heavy workloads). Then practice the actual <strong>system design interview framework</strong> you'll use in real interviews: clarify requirements → estimate scale (users, requests/sec, data size) → sketch high-level architecture → identify bottlenecks → discuss trade-offs out loud.</p>", "keyTerms": ["horizontal/vertical scaling", "load balancer", "cache", "CDN", "read replica", "cache invalidation"], "mistakes": [], "tryItYourself": "<p>As a group: design the high-level architecture for \"a URL shortener at Bit.ly's scale,\" following the 5-step framework out loud, including your caching and load balancing decisions.</p>", "assignment": "<p>Write a one-page system design doc for your Stage 2 project as if it needed to handle 100x more traffic tomorrow: what would you add or change, and why?</p>", "checkYourself": ["Could you walk through the 5-step system design framework out loud, right now, for a system you've never designed before?"], "goFurther": ["\"System Design Interview\" (Alex Xu, Vol. 1, selected chapters)", "ByteByteGo (free YouTube content)"]}, {"number": 21, "title": "DevOps — Docker & CI/CD", "whatYoullLearn": ["How to package your app so it runs identically everywhere", "How to automate your testing and deployment so nothing ships broken"], "whyThisMatters": "", "lessonContent": "<p>Meet <strong>Docker</strong>: packaging your application with everything it needs to run — code, dependencies, runtime — into a <strong>container</strong>, permanently solving \"it works on my machine\":</p><pre class=\"code-block\" data-lang=\"dockerfile\"><code>FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm install\nCOPY . .\nEXPOSE 3000\nCMD [&quot;npm&quot;, &quot;start&quot;]</code></pre><pre class=\"code-block\" data-lang=\"bash\"><code>docker build -t my-app .\ndocker run -p 3000:3000 my-app</code></pre><p>Learn <code>docker-compose</code> for running multi-container setups locally — your app and your database together — mirroring how real teams develop. Then set up <strong>CI/CD (Continuous Integration/Continuous Deployment)</strong> with GitHub Actions: automatically running your tests on every pull request, and automatically deploying when code merges to <code>main</code>, removing manual, error-prone deployment steps entirely:</p><pre class=\"code-block\" data-lang=\"yaml\"><code>name: CI\non: [pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm install\n      - run: npm test</code></pre>", "keyTerms": ["container", "image", "docker-compose", "CI/CD", "pipeline"], "mistakes": [], "tryItYourself": "<p>Containerize your Stage 2 project's frontend and backend with Docker, and get them running together via <code>docker-compose</code>.</p>", "assignment": "<p>Set up a GitHub Actions workflow that runs your test suite automatically on every pull request, and blocks merging if tests fail.</p>", "checkYourself": ["Could you explain to a friend, in one sentence, what problem Docker solves?"], "goFurther": ["Docker official \"Get Started\" guide", "GitHub Actions official documentation"]}, {"number": 22, "title": "Cloud Fundamentals (AWS)", "whatYoullLearn": ["The core cloud services behind almost every production app", "How to deploy and secure infrastructure, not just code"], "whyThisMatters": "", "lessonContent": "<p>Learn core <strong>AWS</strong> services practically: <strong>S3</strong> for static file/object storage, <strong>EC2</strong> for virtual servers, <strong>RDS</strong> for managed relational databases — and <em>why</em> managed cloud services matter: you're not manually patching a database server at 2 AM, the provider handles that layer for you.</p><p>Learn basic infrastructure concepts: regions and availability zones (geographic redundancy), security groups (a cloud-level firewall), and IAM (Identity and Access Management — controlling exactly who and what can access which resources).</p><pre class=\"code-block\" data-lang=\"bash\"><code>aws s3 sync ./build s3://my-app-bucket --delete</code></pre><p>Also get comfortable with simpler platforms built on top of this complexity — Vercel, Render, Railway — as your practical default for most projects, while making sure you genuinely understand what's happening underneath, instead of depending on a magic \"deploy\" button you couldn't explain.</p>", "keyTerms": ["S3", "EC2", "RDS", "region/availability zone", "security group", "IAM"], "mistakes": [], "tryItYourself": "<p>Deploy your capstone's database to a managed RDS (or equivalent) instance and connect your backend to it, configuring security groups correctly.</p>", "assignment": "<p>Write a deployment runbook documenting every step needed to deploy your full application from scratch on a brand-new machine.</p>", "checkYourself": ["Could you explain what IAM controls, and why it matters for security?"], "goFurther": ["AWS Free Tier documentation", "\"AWS Certified Cloud Practitioner\" official study guide (concepts only)"]}, {"number": 23, "title": "Security Best Practices", "whatYoullLearn": ["The OWASP Top 10 vulnerabilities, and how to actually defend against each one", "How to build a security-first habit that carries into every future project"], "whyThisMatters": "", "lessonContent": "<p>Walk through the <strong>OWASP Top 10</strong> with a live example of each vulnerability and its fix: <strong>Injection (SQL Injection)</strong> — never concatenate raw input into a query, always use parameterized queries/ORMs; <strong>Broken Authentication</strong> — enforce strong password rules, rate-limit login attempts, never leak whether an email exists on failed login; <strong>Sensitive Data Exposure</strong> — always use HTTPS, never log secrets; <strong>XSS</strong> — sanitize/escape any user input rendered as HTML; <strong>CSRF</strong> — use tokens or SameSite cookies.</p><pre class=\"code-block\" data-lang=\"js\"><code>// Vulnerable\ndb.query(`SELECT * FROM users WHERE email = &#x27;${email}&#x27;`);\n// Safe — parameterized query\ndb.query(&quot;SELECT * FROM users WHERE email = $1&quot;, [email]);</code></pre><p>Add <strong>rate limiting</strong> to prevent brute-force abuse, validate input on both client and server (remembering server-side is the real boundary), and manage secrets properly — never in source control, always in environment variables or a secret manager. Set up <code>helmet.js</code> in your Express apps for sane default security headers, and learn <strong>Content Security Policy (CSP)</strong> as an additional XSS defense layer.</p>", "keyTerms": ["OWASP Top 10", "SQL injection", "XSS", "CSRF", "rate limiting", "CSP"], "mistakes": [], "tryItYourself": "<p>Given a deliberately vulnerable mini-app, find and patch at least 4 OWASP Top 10 vulnerabilities.</p>", "assignment": "<p>Run a full security audit of your Stage 2 project against the OWASP Top 10, documenting what you found and what you fixed.</p>", "checkYourself": ["Could you explain, and demonstrate, the fix for SQL injection without looking it up?"], "goFurther": ["OWASP Top 10 official documentation", "OWASP Cheat Sheet Series"]}, {"number": 24, "title": "Payments & Third-Party APIs", "whatYoullLearn": ["How to accept real payments, correctly and securely", "How webhooks let external services talk to your server"], "whyThisMatters": "", "lessonContent": "<p>Integrate <strong>Stripe or Paystack</strong> (Paystack especially relevant if you're building for the Nigerian/African market) for real payment processing. The rule that matters most: <strong>never trust client-side \"success\" alone</strong> — always confirm payment via the provider's server-to-server callback.</p><pre class=\"code-block\" data-lang=\"js\"><code>const response = await paystack.transaction.initialize({\n  email: user.email,\n  amount: amount * 100, // kobo\n});</code></pre><p>Learn <strong>webhooks</strong>: how a third-party service notifies your server asynchronously that something happened — and how to verify a webhook's signature, so an attacker can't fake a \"payment successful\" event:</p><pre class=\"code-block\" data-lang=\"js\"><code>app.post(&quot;/webhook/paystack&quot;, (req, res) =&gt; {\n  const hash = crypto.createHmac(&quot;sha512&quot;, secret).update(JSON.stringify(req.body)).digest(&quot;hex&quot;);\n  if (hash !== req.headers[&quot;x-paystack-signature&quot;]) return res.sendStatus(401);\n  res.sendStatus(200);\n});</code></pre>", "keyTerms": ["payment gateway", "webhook", "signature verification", "idempotency"], "mistakes": [], "tryItYourself": "<p>Add a real (test-mode) payment flow to your capstone project, including webhook handling for payment confirmation.</p>", "assignment": "<p>Write tests simulating a webhook arriving twice, and make sure your system handles it idempotently — no duplicate charges or orders.</p>", "checkYourself": ["Could you explain why you should never trust a client-side \"payment successful\" message alone?"], "goFurther": ["Stripe official documentation (\"Accept a payment\")", "Paystack official API documentation"]}, {"number": 25, "title": "Real-Time Features with WebSockets", "whatYoullLearn": ["How to push live data to users instantly, without them refreshing", "When WebSockets are worth the complexity — and when they aren't"], "whyThisMatters": "", "lessonContent": "<p>Contrast the request/response model (client always initiates) with <strong>WebSockets</strong> — a persistent, two-way connection that lets the server push data to the client instantly:</p><pre class=\"code-block\" data-lang=\"js\"><code>io.on(&quot;connection&quot;, (socket) =&gt; {\n  socket.on(&quot;send-message&quot;, (msg) =&gt; {\n    io.emit(&quot;new-message&quot;, msg);\n  });\n});</code></pre><p>Learn connection lifecycle management (handling disconnects/reconnects gracefully) and the real scaling trade-off: WebSocket connections are stateful, which makes horizontal scaling harder — directly tying back to Lesson 20's system design thinking. And learn when simple polling is actually the simpler, sufficient choice instead.</p>", "keyTerms": ["WebSocket", "persistent connection", "broadcast", "polling vs. push"], "mistakes": [], "tryItYourself": "<p>Add a real-time notification feature to your capstone (like \"new order received,\" pushed live to an admin dashboard) using Socket.io.</p>", "assignment": "<p>Build a simple real-time feature of your choice (live chat, a live comment feed, a live collaborative counter) as a standalone mini-project.</p>", "checkYourself": ["Could you explain, with a real example, when polling would actually be the better choice over WebSockets?"], "goFurther": ["Socket.io official documentation", "MDN WebSockets API guide"]}, {"number": 26, "title": "Using AI Tools Like a Professional Engineer", "whatYoullLearn": ["How to use AI coding tools to genuinely accelerate your work, without letting your skills atrophy", "The real risks of AI-generated code, and how to catch them"], "whyThisMatters": "<p>You already use AI tools to write code. This lesson turns that habit into a professional asset instead of a hidden liability — the exact difference employers are now screening for.</p>", "lessonContent": "<p>Hold onto this principle for the rest of your career: <strong>AI tools accelerate a skilled engineer; they don't replace engineering judgment.</strong> Code an AI generates for you still needs to be read, understood, tested, and reviewed exactly as if a junior teammate had written it — because functionally, that's what it is.</p><p>Build this workflow into your habits: understand the problem and sketch your approach <em>before</em> prompting; use AI to accelerate boilerplate, not architecture decisions; always read and understand generated code line by line before you commit it; test AI-generated code as rigorously as your own hand-written code, arguably more so; never paste secrets or client data into an AI prompt; use AI for code review help and learning explanations, not as a substitute for actually understanding your own system.</p><p>Know the real risks: subtly incorrect logic that \"looks right\" at a glance, security vulnerabilities in generated code (like string-concatenated SQL), outdated or deprecated API usage, and — the one that actually ends careers — being an engineer who can't explain their own codebase in an interview or a real production incident.</p>", "keyTerms": ["AI-assisted development", "code review", "technical accountability"], "mistakes": [], "tryItYourself": "<p>Take AI-generated code for a moderately complex function (your instructor will provide one), find the deliberately planted bug or vulnerability, and explain in writing why a careful review process would have caught it.</p>", "assignment": "<p>Write your own short \"AI usage policy\" — how you will and won't use AI tools in professional engineering work — and be ready to defend it in discussion.</p>", "checkYourself": ["Could you explain, honestly, one time AI-generated code fooled you into thinking it was correct when it wasn't?"], "goFurther": ["\"The Pragmatic Programmer\" (selected chapters on professionalism)", "academy-provided AI usage case studies"]}], "project": {"lead": "Choose an original product idea — not a tutorial clone — and build a complete SaaS-style application that includes:", "build": ["A Next.js/React frontend in TypeScript, optimized for performance", "A well-architected backend (REST and/or GraphQL) with authentication and role-based access", "A properly designed, indexed database", "Real payment integration (test mode is fine) with webhook handling", "At least one real-time feature", "A Dockerized setup with a working CI/CD pipeline", "A live deployment on real cloud infrastructure, with a documented deployment runbook", "A completed OWASP-based security audit", "Meaningful automated test coverage across frontend and backend", "Full documentation: README, architecture diagram, and an ADR for at least one major decision"], "assess": "Product completeness &amp; real-world usefulness (20%) · Architecture &amp; system design quality (20%) · Security implementation (15%) · Testing &amp; CI/CD maturity (15%) · Deployment &amp; DevOps execution (15%) · Documentation &amp; defense (15%)", "extra": "<p>You'll present your project (15–20 minutes) — a live demo, an architecture walkthrough, and a defense of at least 3 major technical decisions under questioning. Treat it exactly like a real technical interview, because that's precisely what it's training you for.</p>", "title": "A Production-Grade Full Stack SaaS Application"}}], "appendix": {"Glossary": "<p><strong>API</strong> — a defined way for software to talk to other software. <strong>CRUD</strong> — Create, Read, Update, Delete. <strong>Framework vs. library</strong> — a framework dictates your app's structure; a library is a tool you use on your own terms. <strong>Middleware</strong> — code that runs between a request and a response. <strong>ORM</strong> — software that maps database rows to objects in your code. <strong>REST</strong> — an architectural style for networked APIs. <strong>SPA</strong> — Single Page Application. <strong>SSR/SSG</strong> — server-side rendering / static site generation.</p>", "What Happens If You Don't Pass a Checkpoint": "<p>Each stage ends in a project graded against a published rubric. You need 70%+ to move to the next stage — and if you're below that, you get one guided revision cycle before resubmitting. This isn't a punishment; it's there so Stage 2 and 3 actually make sense when you get to them.</p>", "Keep Growing After Graduation": "<p>MDN Web Docs (your ongoing reference for HTML/CSS/JS) · react.dev (official React documentation) · \"Refactoring UI\" (building real design sense as a developer) · Frontend Masters and Egghead.io (paid deep-dive courses for continued growth).</p>"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('course-data-json').textContent);
const STORAGE_KEY = 'webdev_course_progress_v1';

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {lessons:{}, projects:{}, checks:{}}; }
  catch(e){ return {lessons:{}, projects:{}, checks:{}}; }
}
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

function totalLessons(){ return DATA.stages.reduce((a,s)=>a+s.lessons.length,0); }
function completedLessons(){ return Object.values(progress.lessons).filter(Boolean).length; }
function overallPct(){ return Math.round((completedLessons()/totalLessons())*100) || 0; }
function stageCompletedCount(stage){ return stage.lessons.filter(l=>progress.lessons[stage.id+'-'+l.number]).length; }
function stagePct(stage){ return Math.round((stageCompletedCount(stage)/stage.lessons.length)*100) || 0; }

function updateNavProgress(){
  const pct = overallPct();
  document.getElementById('navProgressFill').style.width = pct+'%';
  document.getElementById('navProgressLabel').textContent = pct+'%';
  updateMascot();
}

function mascotLeaves(){ const p=overallPct(); if(p>=90) return 3; if(p>=40) return 2; if(p>=5) return 1; return 0; }
function updateMascot(){
  document.getElementById('mascotFab').innerHTML = mascotSvgBase(mascotLeaves());
  const heroSlot = document.getElementById('heroMascotSlot');
  if(heroSlot) heroSlot.innerHTML = mascotSvgBase(mascotLeaves());
}
const MASCOT_LINES = [
  "You've got this. One lesson at a time. 🌱",
  "Every expert was once exactly where you are.",
  "Tip: don't skip the self-checks — they're the whole point.",
  "Proud of you for showing up today.",
  "Stuck? Re-reading 'Why this matters' usually unsticks it.",
  "Ship something today, even something small.",
];
function mascotPoke(){
  const el = document.getElementById('mascotSpeech');
  el.textContent = MASCOT_LINES[Math.floor(Math.random()*MASCOT_LINES.length)];
  el.classList.add('show');
  clearTimeout(window.__mto);
  window.__mto = setTimeout(()=>el.classList.remove('show'), 3200);
}

/* ---------- CONFETTI ---------- */
function confettiBurst(){
  const colors = ['#D9622F','#E4A030','#D98A87','#7C9A6C','#F3D3BE'];
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    const size = 6+Math.random()*6;
    p.style.width=size+'px'; p.style.height=(size*0.4)+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    p.style.opacity = 1;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 4000);
  }
}

/* ---------- ROUTER ---------- */
let route = {view:'home'};
function navigate(view, stageNum, lessonNum){
  route = {view, stageNum, lessonNum};
  closeMobileNav();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  const hash = view==='home' ? '#/' : view==='stage' ? `#/stage/${stageNum}` : view==='lesson' ? `#/stage/${stageNum}/lesson/${lessonNum}` : view==='project' ? `#/stage/${stageNum}/project` : `#/${view}`;
  history.pushState(null,'',hash);
}
window.addEventListener('popstate', ()=>{ parseHash(); render(); });
function parseHash(){
  const h = location.hash.replace('#/','');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0){ route={view:'home'}; return; }
  if(parts[0]==='stage' && parts[1]){
    const sn = parseInt(parts[1]);
    if(parts[2]==='lesson' && parts[3]){ route={view:'lesson', stageNum:sn, lessonNum:parseInt(parts[3])}; return; }
    if(parts[2]==='project'){ route={view:'project', stageNum:sn}; return; }
    route={view:'stage', stageNum:sn}; return;
  }
  if(parts[0]==='resources'){ route={view:'resources'}; return; }
  route={view:'home'};
}

function getStage(n){ return DATA.stages.find(s=>s.number===n); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- RENDER: HOME ---------- */
function renderHome(){
  const w = DATA.welcome;
  return `
  <section class="hero">
    <div class="wrap">
      <div class="hero-badge">✨ ${DATA.stages.length} stages · ${totalLessons()} lessons · real deployed projects</div>
      <h1>${esc(DATA.courseTitle).replace('Full Stack Web Development','Full Stack <em>Web Development</em>')}</h1>
      <p class="hero-sub">${w.intro.map(esc).join(' ')}</p>
      <div class="hero-avatar-zone">
        <div style="width:150px;height:150px;" id="heroMascotSlot"></div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="navigate('stage',1)">Begin Your Journey ${ICONS.arrow}</button>
        <button class="btn btn-ghost" onclick="navigate('resources')">Browse Resources</button>
      </div>
      <div class="stats-row">
        <div class="stat-pill"><b>24</b><span>Weeks</span></div>
        <div class="stat-pill"><b>${totalLessons()}</b><span>Lessons</span></div>
        <div class="stat-pill"><b>3</b><span>Real Projects</span></div>
        <div class="stat-pill"><b>${overallPct()}%</b><span>Your Progress</span></div>
      </div>
    </div>
  </section>

  <section class="section reveal">
    <div class="wrap">
      <div class="section-head">
        <div class="section-eyebrow">What you'll walk away with</div>
        <h2>Not certificates. Proof.</h2>
      </div>
      <div class="walk-grid">
        ${w.walkAway.map((item,i)=>`<div class="walk-card"><div class="walk-num">${i+1}</div><p>${item}</p></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="section reveal">
    <div class="wrap">
      <div class="section-head">
        <div class="section-eyebrow">Your path</div>
        <h2>Three stages. One transformation.</h2>
      </div>
      <div class="stage-grid">
        ${DATA.stages.map(renderStageCard).join('')}
      </div>
    </div>
  </section>`;
}

function renderStageCard(stage){
  const pct = stagePct(stage);
  const r = 24, circ = 2*Math.PI*r;
  const offset = circ - (pct/100)*circ;
  return `
  <div class="stage-card reveal in" onclick="navigate('stage', ${stage.number})">
    <div class="stage-top">
      <div class="stage-icon">${ICONS[stage.icon]}</div>
      <div class="stage-ring">
        <svg width="54" height="54"><circle class="bg" cx="27" cy="27" r="${r}"/><circle class="fg" cx="27" cy="27" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/></svg>
        <div class="stage-ring-label">${pct}%</div>
      </div>
    </div>
    <div class="stage-range">${stage.range} · ${stage.name}</div>
    <h3>${esc(stage.subtitle)}</h3>
    <div class="stage-subtitle">Stage ${stage.number}</div>
    <p class="blurb">${esc(stage.blurb)}</p>
    <div class="stage-meta">
      <div class="stage-lessoncount">${stage.lessons.length} lessons · 1 capstone project</div>
      <div class="stage-go">Explore ${ICONS.arrow}</div>
    </div>
  </div>`;
}

/* ---------- RENDER: STAGE ---------- */
function renderStage(stageNum){
  const stage = getStage(stageNum);
  if(!stage) return renderHome();
  const pct = stagePct(stage);
  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb"><button onclick="navigate('home')">Home</button> / <span>Stage ${stage.number} — ${stage.name}</span></div>
      <div class="stage-header reveal in">
        <div class="stage-range">${stage.range}</div>
        <h1>${esc(stage.subtitle)}</h1>
        <div class="subtitle">${esc(stage.blurb)}</div>
        ${stage.intro}
        <div class="stage-progress-bar">
          <div class="nav-progress-track" style="width:100%;"><div class="nav-progress-fill" style="width:${pct}%;"></div></div>
          <div style="font-size:.78rem; font-weight:700; color:var(--ink-soft); margin-top:6px;">${stageCompletedCount(stage)} of ${stage.lessons.length} lessons complete</div>
        </div>
      </div>
      <div class="filter-row">
        <input class="filter-input" id="lessonFilter" placeholder="Search lessons in this stage…" oninput="filterLessons()">
      </div>
      <div class="lesson-grid" id="lessonGrid">
        ${stage.lessons.map(l=>renderLessonCard(stage,l)).join('')}
      </div>
      ${stage.project ? renderProjectCard(stage) : ''}
    </div>
  </section>`;
}

function renderLessonCard(stage, lesson){
  const done = !!progress.lessons[stage.id+'-'+lesson.number];
  return `
  <div class="lesson-card ${done?'done':''}" data-title="${esc(lesson.title).toLowerCase()}" onclick="navigate('lesson', ${stage.number}, ${lesson.number})">
    <div class="lesson-card-top">
      <div class="lesson-num">${lesson.number}</div>
      <div class="lesson-check">${ICONS.checkmark}</div>
    </div>
    <h4>${esc(lesson.title)}</h4>
    <div class="lesson-tags">${lesson.keyTerms.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  </div>`;
}
function filterLessons(){
  const q = document.getElementById('lessonFilter').value.toLowerCase();
  document.querySelectorAll('#lessonGrid .lesson-card').forEach(c=>{
    c.style.display = c.dataset.title.includes(q) ? '' : 'none';
  });
}

function renderProjectCard(stage){
  const done = !!progress.projects[stage.id];
  return `
  <div class="project-card ${done?'done':''}" onclick="navigate('project', ${stage.number})">
    <div class="project-icon">${ICONS.trophy}</div>
    <div class="flex1">
      <span class="project-badge">Stage ${stage.number} Capstone ${done?'· Completed ✓':''}</span>
      <h4>${esc(stage.project.title)}</h4>
      <p style="margin:0;">${esc(stage.project.lead)}</p>
    </div>
    <div class="stage-go">View project ${ICONS.arrow}</div>
  </div>`;
}

/* ---------- RENDER: LESSON ---------- */
function renderLesson(stageNum, lessonNum){
  const stage = getStage(stageNum);
  if(!stage) return renderHome();
  const lesson = stage.lessons.find(l=>l.number===lessonNum);
  if(!lesson) return renderStage(stageNum);
  const key = stage.id+'-'+lesson.number;
  const done = !!progress.lessons[key];
  const nextLesson = stage.lessons.find(l=>l.number===lessonNum+1);

  const navItems = stage.lessons.map(l=>{
    const d = !!progress.lessons[stage.id+'-'+l.number];
    const active = l.number===lessonNum;
    return `<div class="lesson-nav-item ${active?'active':''} ${d?'done':''}" onclick="navigate('lesson', ${stage.number}, ${l.number})"><span class="lesson-nav-dot"></span> ${l.number}. ${esc(l.title)}</div>`;
  }).join('') + `<div class="lesson-nav-item" onclick="navigate('project', ${stage.number})"><span class="lesson-nav-dot"></span> 🏆 Capstone Project</div>`;

  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb">
        <button onclick="navigate('home')">Home</button> /
        <button onclick="navigate('stage', ${stage.number})">Stage ${stage.number}</button> /
        <span>Lesson ${lesson.number}</span>
      </div>
      <div class="lesson-layout">
        <aside class="lesson-nav">${navItems}</aside>
        <div class="lesson-main">
          <div class="lesson-hero reveal in">
            <div class="lesson-eyebrow">${ICONS[stage.icon]} Stage ${stage.number} · Lesson ${lesson.number} of ${stage.lessons.length}</div>
            <h1>${esc(lesson.title)}</h1>
          </div>

          <div class="card-block block-learn">
            <h3>${ICONS.learn} What you'll learn</h3>
            <ul class="plain-list">${lesson.whatYoullLearn.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>

          <div class="card-block block-why">
            <h3>${ICONS.why} Why this matters</h3>
            ${lesson.whyThisMatters}
          </div>

          <div class="card-block block-lesson">
            <h3>${ICONS.lesson} The Lesson</h3>
            ${lesson.lessonContent}
          </div>

          <div class="card-block">
            <h3>${ICONS.terms} Key terms you need to know</h3>
            <div class="term-grid">${lesson.keyTerms.map(t=>`<span class="term-chip">${esc(t)}</span>`).join('')}</div>
          </div>

          <div class="card-block block-mistakes">
            <h3>${ICONS.mistake} Mistakes learners make at this stage</h3>
            <ul class="plain-list">${lesson.mistakes.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>

          <div class="card-block block-try">
            <h3>${ICONS.try} Try it yourself</h3>
            ${lesson.tryItYourself}
          </div>

          <div class="card-block block-assignment">
            <h3>${ICONS.assignment} Your assignment</h3>
            ${lesson.assignment}
          </div>

          <div class="card-block">
            <h3>${ICONS.check} Check yourself before moving on</h3>
            <ul class="check-list">
              ${lesson.checkYourself.map((c,i)=>{
                const ckey = key+'-c'+i;
                const checked = !!progress.checks[ckey];
                return `<li class="checkitem ${checked?'checked':''}" onclick="toggleCheck('${ckey}', this)"><span class="checkbox">${ICONS.checkmark}</span><span class="ctext">${c}</span></li>`;
              }).join('')}
            </ul>
          </div>

          <div class="card-block">
            <h3>${ICONS.further} Go further</h3>
            <div class="gofurther-list">${lesson.goFurther.map(g=>`<div>${g}</div>`).join('')}</div>
          </div>

          <div class="lesson-footer">
            <button class="complete-btn ${done?'is-done':''}" onclick="toggleLessonDone('${key}', this)">
              ${ICONS.checkmark} ${done? 'Marked Complete' : 'Mark Lesson Complete'}
            </button>
            ${nextLesson ? `<button class="next-btn" onclick="navigate('lesson', ${stage.number}, ${nextLesson.number})">Next: ${esc(nextLesson.title)} ${ICONS.arrow}</button>`
              : `<button class="next-btn" onclick="navigate('project', ${stage.number})">Go to Capstone Project ${ICONS.arrow}</button>`}
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function toggleCheck(key, el){
  progress.checks[key] = !progress.checks[key];
  saveProgress(progress);
  el.classList.toggle('checked');
}

function toggleLessonDone(key, btn){
  const wasDone = !!progress.lessons[key];
  progress.lessons[key] = !wasDone;
  saveProgress(progress);
  updateNavProgress();
  if(!wasDone){
    btn.classList.add('is-done');
    btn.innerHTML = ICONS.checkmark + ' Marked Complete';
    confettiBurst();
    mascotSay("Nice work — that's one more in the bag! 🎉");
  } else {
    btn.classList.remove('is-done');
    btn.innerHTML = ICONS.checkmark + ' Mark Lesson Complete';
  }
}
function mascotSay(text){
  const el = document.getElementById('mascotSpeech');
  el.textContent = text; el.classList.add('show');
  clearTimeout(window.__mto);
  window.__mto = setTimeout(()=>el.classList.remove('show'), 3200);
}

/* ---------- RENDER: PROJECT ---------- */
function renderProject(stageNum){
  const stage = getStage(stageNum);
  if(!stage || !stage.project) return renderStage(stageNum);
  const p = stage.project;
  const done = !!progress.projects[stage.id];
  const assessItems = p.assess.split('·').map(s=>s.trim()).filter(Boolean);

  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb">
        <button onclick="navigate('home')">Home</button> /
        <button onclick="navigate('stage', ${stage.number})">Stage ${stage.number}</button> /
        <span>Capstone Project</span>
      </div>
      <div class="project-hero reveal in">
        <div style="width:70px;height:70px;margin:0 auto 14px;">${ICONS.trophy}</div>
        <span class="project-badge">Stage ${stage.number} Capstone</span>
        <h1>${esc(p.title)}</h1>
        <p style="max-width:520px;margin:0 auto;">${esc(p.lead)}</p>
      </div>

      <div class="card-block">
        <h3>${ICONS.assignment} What you'll build</h3>
        <ul class="plain-list">${p.build.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>

      <div class="card-block">
        <h3>${ICONS.check} How you'll be assessed</h3>
        <div class="assess-bars">
          ${assessItems.map(item=>{
            const m = item.match(/^(.*)\((\d+)%\)$/);
            const label = m?m[1].trim():item;
            const pct = m?m[2]:'—';
            return `<div class="assess-bar-row"><div class="assess-bar-label">${esc(label)}</div><div class="assess-bar-track"><div class="assess-bar-fill" style="width:${pct}%"></div></div><div class="assess-bar-pct">${pct}%</div></div>`;
          }).join('')}
        </div>
      </div>

      ${p.extra?`<div class="card-block block-why"><h3>${ICONS.why} Good to know</h3>${p.extra}</div>`:''}

      <div class="lesson-footer">
        <button class="complete-btn ${done?'is-done':''}" onclick="toggleProjectDone('${stage.id}', this)">
          ${ICONS.trophy} ${done? 'Capstone Complete!' : 'Mark Capstone Complete'}
        </button>
        <button class="next-btn" onclick="navigate('home')">Back to Overview ${ICONS.arrow}</button>
      </div>
    </div>
  </section>`;
}
function toggleProjectDone(stageId, btn){
  const wasDone = !!progress.projects[stageId];
  progress.projects[stageId] = !wasDone;
  saveProgress(progress);
  if(!wasDone){
    btn.classList.add('is-done');
    btn.innerHTML = ICONS.trophy + ' Capstone Complete!';
    confettiBurst(); setTimeout(confettiBurst, 300);
    mascotSay("A whole stage, done. That's huge. 🌟");
  } else {
    btn.classList.remove('is-done');
    btn.innerHTML = ICONS.trophy + ' Mark Capstone Complete';
  }
}

/* ---------- RENDER: RESOURCES ---------- */
function renderResources(){
  const a = DATA.appendix;
  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb"><button onclick="navigate('home')">Home</button> / <span>Resources</span></div>
      <div class="section-head" style="text-align:left; margin:0 0 30px;">
        <div class="section-eyebrow">For you to keep</div>
        <h2>Glossary & Growth</h2>
      </div>
      ${Object.entries(a).map(([heading, body])=>`
        <div class="card-block">
          <h3 style="font-size:1.05rem; text-transform:none; letter-spacing:0;">${esc(heading)}</h3>
          ${body}
        </div>
      `).join('')}
    </div>
  </section>`;
}

/* ---------- MAIN RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(route.view==='home') html = renderHome();
  else if(route.view==='stage') html = renderStage(route.stageNum);
  else if(route.view==='lesson') html = renderLesson(route.stageNum, route.lessonNum);
  else if(route.view==='project') html = renderProject(route.stageNum);
  else if(route.view==='resources') html = renderResources();
  else html = renderHome();
  app.innerHTML = html;
  updateNavProgress();
  setupReveal();
}

function setupReveal(){
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.1});
  els.forEach(el=>io.observe(el));
}

/* ---------- MOBILE NAV ---------- */
function closeMobileNav(){
  document.getElementById('navOverlay').classList.remove('show');
  document.getElementById('navPanel').classList.remove('show');
}
document.getElementById('mobileMenuBtn').addEventListener('click', ()=>{
  document.getElementById('navOverlay').classList.add('show');
  document.getElementById('navPanel').classList.add('show');
});
document.getElementById('navOverlay').addEventListener('click', closeMobileNav);

/* ---------- THEME ---------- */
function initTheme(){
  const saved = localStorage.getItem('webdev_theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('webdev_theme', next); }catch(e){}
});

/* ---------- INIT ---------- */
try{ initTheme(); }catch(e){}
parseHash();
render();
setTimeout(()=>{ mascotSay("Hi! I'm your learning buddy. Tap me anytime. 👋"); }, 1200);
</script>
</body>
</html>
