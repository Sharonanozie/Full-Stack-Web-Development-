<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Stack Web Development — Your Learning Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF1E2; --cream-deep:#F3E3C9; --card:#FFFCF6;
  --ink:#3A2A1E; --ink-soft:#6E5A48; --ink-faint:#9C8770;
  --terracotta:#D9622F; --terracotta-deep:#B84A1E; --terracotta-soft:#F3D3BE;
  --gold:#E4A030; --gold-soft:#F7E3B8;
  --rose:#D98A87; --rose-soft:#F5DAD6;
  --sage:#7C9A6C; --sage-soft:#DCE7D2;
  --line:rgba(58,42,30,.12);
  --shadow:0 10px 30px rgba(58,42,30,.10);
  --shadow-lg:0 20px 50px rgba(58,42,30,.16);
  --radius:22px; --radius-sm:14px;
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --cream:#241a13; --cream-deep:#2e2119; --card:#2c2018;
    --ink:#F3E3C9; --ink-soft:#D8C4A8; --ink-faint:#a58e73;
    --terracotta-soft:#4a2c1c; --gold-soft:#4a3a1c; --rose-soft:#3f2a29; --sage-soft:#293a24;
    --line:rgba(243,227,201,.14);
    --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --cream:#241a13; --cream-deep:#2e2119; --card:#2c2018;
  --ink:#F3E3C9; --ink-soft:#D8C4A8; --ink-faint:#a58e73;
  --terracotta-soft:#4a2c1c; --gold-soft:#4a3a1c; --rose-soft:#3f2a29; --sage-soft:#293a24;
  --line:rgba(243,227,201,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top: calc(78px + env(safe-area-inset-top,0px));}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-.01em;}
p{line-height:1.7; color:var(--ink-soft); margin:0 0 1em;}
a{color:var(--terracotta-deep);}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold-soft);}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
img{max-width:100%;}

/* ============ BACKGROUND BLOBS ============ */
.bg-blobs{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
.blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; animation:drift 22s ease-in-out infinite;}
.blob.b1{width:420px;height:420px; background:var(--terracotta-soft); top:-120px; left:-100px; animation-delay:0s;}
.blob.b2{width:340px;height:340px; background:var(--gold-soft); top:20%; right:-120px; animation-delay:-6s;}
.blob.b3{width:380px;height:380px; background:var(--rose-soft); bottom:-140px; left:20%; animation-delay:-12s;}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(30px,-40px) scale(1.08);}
  66%{transform:translate(-25px,25px) scale(.95);}
}

/* ============ TOP NAV ============ */
.topnav{
  position:sticky; top:0; z-index:50;
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb, var(--cream) 88%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.topnav-inner{max-width:1120px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px;}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:0;}
.brand-mark{width:36px;height:36px; flex:none;}
.brand-text{font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; color:var(--ink);}
.brand-text small{display:block; font-family:'Plus Jakarta Sans'; font-weight:500; font-size:.68rem; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase;}
.nav-spacer{flex:1;}
.nav-progress{display:flex; align-items:center; gap:10px; margin-right:6px;}
.nav-progress-track{width:120px; height:8px; border-radius:99px; background:var(--cream-deep); overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.08);}
.nav-progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--terracotta)); width:0%; transition:width .8s cubic-bezier(.22,1,.36,1);}
.nav-progress-label{font-size:.72rem; font-weight:700; color:var(--ink-soft); white-space:nowrap;}
.icon-btn{
  width:38px;height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; transition:transform .25s, box-shadow .25s;
}
.icon-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
.icon-btn svg{width:18px;height:18px;}

/* ============ HERO ============ */
.hero{padding:70px 24px 40px; text-align:center; position:relative;}
.hero-badge{
  display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:99px;
  background:var(--card); border:1px solid var(--line); font-size:.78rem; font-weight:700;
  color:var(--terracotta-deep); margin-bottom:26px; box-shadow:var(--shadow);
  animation:fadeInUp .7s ease both;
}
.hero h1{
  font-size:clamp(2.3rem, 6vw, 4.2rem); line-height:1.04; margin-bottom:18px;
  animation:fadeInUp .8s .05s ease both;
}
.hero h1 em{font-style:italic; color:var(--terracotta);}
.hero-sub{
  max-width:600px; margin:0 auto 34px; font-size:1.12rem; color:var(--ink-soft);
  animation:fadeInUp .8s .12s ease both;
}
.hero-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:52px; animation:fadeInUp .8s .18s ease both;}
.btn{
  border:none; border-radius:99px; padding:15px 30px; font-weight:700; font-size:.98rem;
  display:inline-flex; align-items:center; gap:8px; transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;
}
.btn-primary{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-deep)); color:#fff; box-shadow:0 10px 24px rgba(217,98,47,.35);}
.btn-primary:hover{transform:translateY(-3px) scale(1.02); box-shadow:0 16px 32px rgba(217,98,47,.42);}
.btn-ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
.btn:active{transform:translateY(0) scale(.98);}

.hero-avatar-zone{position:relative; height:190px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; animation:fadeInUp .9s .22s ease both;}
.mascot{width:150px;height:150px; animation:bob 4.5s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-14px) rotate(2deg);}}
.mascot .eye{animation:blink 5s infinite;}
@keyframes blink{0%,92%,100%{transform:scaleY(1);} 96%{transform:scaleY(.1);}}
.sparkle{position:absolute; animation:sparkle 2.6s ease-in-out infinite;}
@keyframes sparkle{0%,100%{opacity:.2; transform:scale(.6) rotate(0deg);} 50%{opacity:1; transform:scale(1.1) rotate(25deg);}}

.stats-row{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; animation:fadeInUp .9s .28s ease both;}
.stat-pill{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 22px;
  min-width:120px; box-shadow:var(--shadow);
}
.stat-pill b{display:block; font-family:'Fraunces',serif; font-size:1.5rem; color:var(--terracotta-deep);}
.stat-pill span{font-size:.75rem; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}

@keyframes fadeInUp{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:translateY(0);}}
.reveal{opacity:0; transform:translateY(28px); transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);}
.reveal.in{opacity:1; transform:translateY(0);}

/* ============ SECTION HEADERS ============ */
.section{padding:64px 24px;}
.section-head{text-align:center; max-width:640px; margin:0 auto 40px;}
.section-eyebrow{font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--terracotta);}
.section-head h2{font-size:clamp(1.7rem,3.6vw,2.4rem); margin-top:8px;}

/* ============ WALKAWAY CARDS ============ */
.walk-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; max-width:1000px; margin:0 auto;}
.walk-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px; box-shadow:var(--shadow); transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s;
}
.walk-card:hover{transform:translateY(-6px) rotate(-.5deg); box-shadow:var(--shadow-lg);}
.walk-num{
  width:34px;height:34px; border-radius:10px; background:var(--gold-soft); color:var(--terracotta-deep);
  display:flex; align-items:center; justify-content:center; font-weight:800; margin-bottom:14px; font-family:'Fraunces',serif;
}
.walk-card p{margin:0; color:var(--ink); font-weight:500; font-size:.95rem;}

/* ============ STAGE CARDS ============ */
.stage-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px;}
.stage-card{
  background:var(--card); border:1px solid var(--line); border-radius:28px; padding:30px;
  cursor:pointer; position:relative; overflow:hidden; box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
}
.stage-card:hover{transform:translateY(-8px) scale(1.015); box-shadow:var(--shadow-lg);}
.stage-card::after{
  content:''; position:absolute; inset:0; opacity:0; background:radial-gradient(circle at 80% 0%, var(--gold-soft), transparent 60%);
  transition:opacity .35s;
}
.stage-card:hover::after{opacity:1;}
.stage-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; position:relative;}
.stage-icon{width:52px;height:52px;}
.stage-ring{position:relative; width:54px;height:54px;}
.stage-ring svg{transform:rotate(-90deg);}
.stage-ring circle{fill:none; stroke-width:5;}
.stage-ring .bg{stroke:var(--cream-deep);}
.stage-ring .fg{stroke:var(--terracotta); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1);}
.stage-ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:800; color:var(--terracotta-deep);}
.stage-range{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px;}
.stage-card h3{font-size:1.5rem; margin-bottom:4px; position:relative;}
.stage-card .stage-subtitle{font-size:.85rem; color:var(--terracotta-deep); font-weight:700; margin-bottom:12px;}
.stage-card p.blurb{font-size:.92rem; margin-bottom:18px; position:relative;}
.stage-meta{display:flex; align-items:center; justify-content:space-between; position:relative;}
.stage-lessoncount{font-size:.78rem; font-weight:700; color:var(--ink-faint);}
.stage-go{display:flex; align-items:center; gap:6px; font-weight:700; font-size:.85rem; color:var(--terracotta-deep);}
.stage-go svg{width:16px;height:16px; transition:transform .25s;}
.stage-card:hover .stage-go svg{transform:translateX(4px);}

/* ============ BREADCRUMB / STAGE VIEW ============ */
.crumb{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--ink-faint); margin-bottom:26px; flex-wrap:wrap;}
.crumb button{background:none; border:none; color:var(--terracotta-deep); font-weight:700; padding:0;}
.crumb button:hover{text-decoration:underline;}
.stage-header{margin-bottom:36px;}
.stage-header .stage-range{margin-bottom:10px;}
.stage-header h1{font-size:clamp(1.9rem,4vw,2.7rem); margin-bottom:10px;}
.stage-header .subtitle{color:var(--terracotta-deep); font-weight:700; margin-bottom:14px;}
.stage-progress-bar{max-width:420px; margin-top:18px;}

.filter-row{display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; align-items:center;}
.filter-input{
  flex:1; min-width:200px; padding:12px 18px; border-radius:99px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:inherit; font-size:.92rem;
}
.filter-input:focus{outline:2px solid var(--terracotta-soft);}

.lesson-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-bottom:26px;}
.lesson-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px;
  cursor:pointer; transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:12px; position:relative;
}
.lesson-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg);}
.lesson-card.done{background:linear-gradient(160deg, var(--sage-soft), var(--card) 60%);}
.lesson-card-top{display:flex; align-items:center; justify-content:space-between;}
.lesson-num{
  width:36px;height:36px; border-radius:11px; background:var(--terracotta-soft); color:var(--terracotta-deep);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Fraunces',serif; font-size:.95rem;
}
.lesson-check{
  width:26px;height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  transition:all .3s;
}
.lesson-card.done .lesson-check{background:var(--sage); border-color:var(--sage);}
.lesson-check svg{width:14px;height:14px; opacity:0; transition:opacity .2s; stroke:#fff;}
.lesson-card.done .lesson-check svg{opacity:1;}
.lesson-card h4{font-size:1.05rem; line-height:1.3;}
.lesson-tags{display:flex; flex-wrap:wrap; gap:6px;}
.tag{
  font-size:.68rem; font-weight:700; background:var(--cream-deep); color:var(--ink-soft);
  padding:4px 10px; border-radius:99px;
}
.project-card{
  background:linear-gradient(135deg, var(--gold-soft), var(--rose-soft));
  border:1px solid var(--line); border-radius:var(--radius); padding:28px; cursor:pointer;
  transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.project-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg);}
.project-icon{width:56px;height:56px; flex:none;}
.project-card h4{font-size:1.3rem; margin-bottom:4px;}
.project-card .flex1{flex:1; min-width:200px;}
.project-badge{
  font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--terracotta-deep);
  margin-bottom:6px; display:block;
}

/* ============ LESSON DETAIL ============ */
.lesson-layout{display:grid; grid-template-columns:220px 1fr; gap:40px; align-items:flex-start;}
@media (max-width:820px){.lesson-layout{grid-template-columns:1fr;}}
.lesson-nav{
  position:sticky; top:96px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:16px; max-height:70vh; overflow-y:auto;
}
.lesson-nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; font-size:.82rem;
  font-weight:600; color:var(--ink-soft); cursor:pointer; transition:background .2s;
}
.lesson-nav-item:hover{background:var(--cream-deep);}
.lesson-nav-item.active{background:var(--terracotta-soft); color:var(--terracotta-deep);}
.lesson-nav-dot{width:8px;height:8px;border-radius:50%; background:var(--line); flex:none;}
.lesson-nav-item.done .lesson-nav-dot{background:var(--sage);}
.lesson-nav-item.active .lesson-nav-dot{background:var(--terracotta);}

.lesson-main{min-width:0;}
.lesson-hero{margin-bottom:30px;}
.lesson-eyebrow{font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--terracotta-deep); display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.lesson-hero h1{font-size:clamp(1.7rem,4vw,2.5rem); margin-bottom:16px;}

.card-block{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px;
  margin-bottom:22px; box-shadow:var(--shadow); animation:fadeInUp .5s ease both;
}
.card-block h3{
  font-size:1.02rem; display:flex; align-items:center; gap:10px; margin-bottom:14px; color:var(--ink);
  font-family:'Plus Jakarta Sans'; font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:.82rem;
}
.card-block h3 .ic{width:20px;height:20px; flex:none;}
.block-learn{background:var(--card);}
.block-why{background:linear-gradient(135deg, var(--rose-soft), var(--card) 70%); border-left:4px solid var(--rose);}
.block-why h3{color:var(--terracotta-deep);}
.block-why p{color:var(--ink); font-style:italic; font-size:1.02rem;}
.block-lesson{padding-bottom:8px;}
.block-lesson p{color:var(--ink); font-size:1rem;}
.block-lesson ul,.block-lesson ol{color:var(--ink); padding-left:22px; line-height:1.8; margin:0 0 1em;}
.block-lesson li{margin-bottom:6px;}
.block-mistakes{background:linear-gradient(135deg, var(--gold-soft), var(--card) 70%); border-left:4px solid var(--gold);}
.block-try{background:linear-gradient(135deg, var(--sage-soft), var(--card) 70%); border-left:4px solid var(--sage);}
.block-assignment{background:linear-gradient(135deg, var(--terracotta-soft), var(--card) 70%); border-left:4px solid var(--terracotta);}

ul.check-list, ul.plain-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
ul.plain-list li{display:flex; gap:10px; align-items:flex-start; font-size:.95rem; color:var(--ink);}
ul.plain-list li::before{content:'✦'; color:var(--terracotta); flex:none; margin-top:2px;}

.checkitem{
  display:flex; align-items:flex-start; gap:12px; padding:10px 12px; border-radius:12px; cursor:pointer;
  transition:background .2s; font-size:.95rem; color:var(--ink);
}
.checkitem:hover{background:var(--cream-deep);}
.checkbox{
  width:22px;height:22px; border-radius:7px; border:2px solid var(--ink-faint); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.checkitem.checked .checkbox{background:var(--sage); border-color:var(--sage);}
.checkbox svg{width:12px;height:12px; opacity:0; stroke:#fff; transition:opacity .15s;}
.checkitem.checked .checkbox svg{opacity:1;}
.checkitem.checked span.ctext{color:var(--ink-faint); text-decoration:line-through;}

.term-grid{display:flex; flex-wrap:wrap; gap:8px;}
.term-chip{
  background:var(--cream-deep); color:var(--ink); padding:7px 14px; border-radius:99px; font-size:.82rem; font-weight:700;
  border:1px solid var(--line); transition:transform .2s, background .2s;
}
.term-chip:hover{transform:translateY(-2px) scale(1.04); background:var(--gold-soft);}

.gofurther-list{display:flex; flex-direction:column; gap:8px;}
.gofurther-list div{font-size:.9rem; color:var(--ink-soft); padding-left:22px; position:relative;}
.gofurther-list div::before{content:'📚'; position:absolute; left:0;}

pre.code-block{
  background:#2A2019; color:#F3E3C9; border-radius:14px; padding:18px 20px; overflow-x:auto;
  font-family:'JetBrains Mono',monospace; font-size:.83rem; line-height:1.65; margin:16px 0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
pre.code-block code{background:none; padding:0; color:inherit;}
.block-lesson code, p code{
  background:var(--gold-soft); color:var(--terracotta-deep); padding:2px 7px; border-radius:6px;
  font-family:'JetBrains Mono',monospace; font-size:.85em;
}

.lesson-footer{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:10px; flex-wrap:wrap;}
.complete-btn{
  background:linear-gradient(135deg,var(--sage),#6a8a58); color:#fff; border-radius:99px; padding:16px 30px;
  font-weight:800; font-size:.95rem; border:none; display:flex; align-items:center; gap:10px;
  box-shadow:0 10px 24px rgba(124,154,108,.35); transition:transform .25s, box-shadow .25s;
}
.complete-btn.is-done{background:linear-gradient(135deg,var(--ink-faint),var(--ink-soft));}
.complete-btn:hover{transform:translateY(-3px) scale(1.02);}
.next-btn{
  background:var(--card); border:1px solid var(--line); border-radius:99px; padding:16px 26px; font-weight:700;
  display:flex; align-items:center; gap:8px; color:var(--ink); transition:transform .25s, box-shadow .25s;
}
.next-btn:hover{transform:translateY(-3px); box-shadow:var(--shadow);}

/* ============ PROJECT VIEW ============ */
.project-hero{
  background:linear-gradient(135deg, var(--gold-soft), var(--rose-soft)); border-radius:28px; padding:40px;
  margin-bottom:28px; text-align:center; position:relative; overflow:hidden;
}
.project-hero h1{font-size:clamp(1.7rem,4vw,2.4rem); margin:10px 0;}
.assess-bars{display:flex; flex-direction:column; gap:12px;}
.assess-bar-row{display:flex; align-items:center; gap:14px;}
.assess-bar-label{font-size:.85rem; font-weight:700; width:230px; flex:none; color:var(--ink);}
.assess-bar-track{flex:1; height:10px; background:var(--cream-deep); border-radius:99px; overflow:hidden;}
.assess-bar-fill{height:100%; background:linear-gradient(90deg,var(--terracotta),var(--gold)); border-radius:99px; width:0%; transition:width 1.2s cubic-bezier(.22,1,.36,1);}
.assess-bar-pct{width:44px; text-align:right; font-weight:800; font-size:.82rem; color:var(--terracotta-deep);}

/* ============ RESOURCES ============ */
.glossary-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
.glossary-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow);}

/* ============ FOOTER ============ */
footer{padding:50px 24px 80px; text-align:center; color:var(--ink-faint); font-size:.85rem;}

/* ============ MASCOT WIDGET (floating) ============ */
.mascot-fab{
  position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px)); right:22px; z-index:60;
  width:64px;height:64px; cursor:pointer; filter:drop-shadow(0 8px 18px rgba(0,0,0,.18));
  animation:bob 4.5s ease-in-out infinite; transition:transform .3s;
}
.mascot-fab:hover{transform:scale(1.1);}
.mascot-speech{
  position:fixed; bottom:calc(92px + env(safe-area-inset-bottom,0px)); right:22px; z-index:60;
  background:var(--card); border:1px solid var(--line); border-radius:16px 16px 4px 16px; padding:12px 16px;
  font-size:.82rem; font-weight:600; max-width:220px; box-shadow:var(--shadow-lg); color:var(--ink);
  opacity:0; transform:translateY(8px) scale(.95); pointer-events:none; transition:all .3s cubic-bezier(.22,1,.36,1);
}
.mascot-speech.show{opacity:1; transform:translateY(0) scale(1);}

/* ============ CONFETTI ============ */
.confetti-piece{position:fixed; top:-20px; z-index:200; border-radius:2px; pointer-events:none; animation:confettifall linear forwards;}
@keyframes confettifall{
  to{transform:translateY(110vh) rotate(540deg); opacity:.3;}
}

/* ============ MOBILE NAV DRAWER ============ */
.mobile-nav-overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:70; opacity:0; pointer-events:none; transition:opacity .3s;}
.mobile-nav-overlay.show{opacity:1; pointer-events:auto;}
.mobile-nav-panel{
  position:fixed; top:0; right:-320px; bottom:0; width:300px; background:var(--card); z-index:71;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); transition:right .35s cubic-bezier(.22,1,.36,1);
  box-shadow:-10px 0 30px rgba(0,0,0,.15);
}
.mobile-nav-panel.show{right:0;}
.mobile-nav-panel a, .mobile-nav-panel button{
  display:block; width:100%; text-align:left; background:none; border:none; padding:12px 8px; font-weight:700;
  color:var(--ink); border-bottom:1px solid var(--line); font-size:.95rem;
}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--terracotta-soft); border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

@media (max-width:640px){
  .wrap{padding:0 18px;}
  .nav-progress{display:none;}
  .hero{padding:50px 18px 30px;}
  .stat-pill{min-width:100px; padding:12px 16px;}
  .assess-bar-label{width:150px; font-size:.76rem;}
}
</style>
</head>
<body>

<div class="bg-blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<nav class="topnav">
  <div class="topnav-inner">
    <button class="brand" onclick="navigate('home')" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="var(--terracotta)"/><path d="M12 22c2-8 6-12 8-12s6 4 8 12" stroke="var(--gold-soft)" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="15" cy="19" r="2" fill="#fff"/><circle cx="25" cy="19" r="2" fill="#fff"/></svg>
      <span class="brand-text">Full Stack Web Dev<small>Learning Path</small></span>
    </button>
    <div class="nav-spacer"></div>
    <div class="nav-progress">
      <div class="nav-progress-track"><div class="nav-progress-fill" id="navProgressFill"></div></div>
      <div class="nav-progress-label" id="navProgressLabel">0%</div>
    </div>
    <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="mobileMenuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</nav>

<div class="mobile-nav-overlay" id="navOverlay"></div>
<div class="mobile-nav-panel" id="navPanel">
  <button onclick="navigate('home')">🏠 Home</button>
  <button onclick="navigate('stage',1)">🌱 Stage 1 — Basic</button>
  <button onclick="navigate('stage',2)">🌿 Stage 2 — Intermediate</button>
  <button onclick="navigate('stage',3)">🌳 Stage 3 — Advanced</button>
  <button onclick="navigate('resources')">📖 Resources</button>
</div>

<main id="app"></main>

<div class="mascot-speech" id="mascotSpeech"></div>
<div class="mascot-fab" id="mascotFab" onclick="mascotPoke()" title="Your learning buddy"></div>

<footer class="wrap">
  <p>Built for learners who want more than a tutorial — a real path to becoming a full stack engineer.</p>
</footer>

<script id="course-data-json" type="application/json">__COURSE_DATA_JSON__</script>
<script>
const DATA = JSON.parse(document.getElementById('course-data-json').textContent);
const STORAGE_KEY = 'webdev_course_progress_v1';

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {lessons:{}, projects:{}, checks:{}}; }
  catch(e){ return {lessons:{}, projects:{}, checks:{}}; }
}
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

function totalLessons(){ return DATA.stages.reduce((a,s)=>a+s.lessons.length,0); }
function completedLessons(){ return Object.values(progress.lessons).filter(Boolean).length; }
function overallPct(){ return Math.round((completedLessons()/totalLessons())*100) || 0; }
function stageCompletedCount(stage){ return stage.lessons.filter(l=>progress.lessons[stage.id+'-'+l.number]).length; }
function stagePct(stage){ return Math.round((stageCompletedCount(stage)/stage.lessons.length)*100) || 0; }

function updateNavProgress(){
  const pct = overallPct();
  document.getElementById('navProgressFill').style.width = pct+'%';
  document.getElementById('navProgressLabel').textContent = pct+'%';
  updateMascot();
}

/* ---------- MASCOT ---------- */
const mascotSvgBase = (leaves)=>`
<svg viewBox="0 0 120 120" width="100%" height="100%">
  <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="var(--gold)"/><stop offset="100%" stop-color="var(--terracotta)"/>
  </linearGradient></defs>
  <ellipse cx="60" cy="100" rx="26" ry="6" fill="rgba(0,0,0,.08)"/>
  ${leaves>=1?'<path d="M60 30 C50 18 40 20 38 8 C52 8 60 18 60 30 Z" fill="var(--sage)"/>':''}
  ${leaves>=2?'<path d="M60 30 C70 18 80 20 82 8 C68 8 60 18 60 30 Z" fill="var(--sage)"/>':''}
  ${leaves>=3?'<path d="M60 26 C60 12 60 6 60 2 C60 12 60 20 60 26 Z" stroke="var(--sage)" stroke-width="4" fill="none" stroke-linecap="round"/>':''}
  <circle cx="60" cy="66" r="40" fill="url(#mg)"/>
  <ellipse class="eye" cx="47" cy="62" rx="5" ry="6" fill="#3A2A1E" style="transform-origin:47px 62px"/>
  <ellipse class="eye" cx="73" cy="62" rx="5" ry="6" fill="#3A2A1E" style="transform-origin:73px 62px"/>
  <circle cx="38" cy="74" r="6" fill="var(--rose)" opacity=".7"/>
  <circle cx="82" cy="74" r="6" fill="var(--rose)" opacity=".7"/>
  <path d="M48 80 Q60 90 72 80" stroke="#3A2A1E" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;
function mascotLeaves(){ const p=overallPct(); if(p>=90) return 3; if(p>=40) return 2; if(p>=5) return 1; return 0; }
function updateMascot(){
  document.getElementById('mascotFab').innerHTML = mascotSvgBase(mascotLeaves());
  const heroSlot = document.getElementById('heroMascotSlot');
  if(heroSlot) heroSlot.innerHTML = mascotSvgBase(mascotLeaves());
}
const MASCOT_LINES = [
  "You've got this. One lesson at a time. 🌱",
  "Every expert was once exactly where you are.",
  "Tip: don't skip the self-checks — they're the whole point.",
  "Proud of you for showing up today.",
  "Stuck? Re-reading 'Why this matters' usually unsticks it.",
  "Ship something today, even something small.",
];
function mascotPoke(){
  const el = document.getElementById('mascotSpeech');
  el.textContent = MASCOT_LINES[Math.floor(Math.random()*MASCOT_LINES.length)];
  el.classList.add('show');
  clearTimeout(window.__mto);
  window.__mto = setTimeout(()=>el.classList.remove('show'), 3200);
}

/* ---------- CONFETTI ---------- */
function confettiBurst(){
  const colors = ['#D9622F','#E4A030','#D98A87','#7C9A6C','#F3D3BE'];
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    const size = 6+Math.random()*6;
    p.style.width=size+'px'; p.style.height=(size*0.4)+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    p.style.opacity = 1;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 4000);
  }
}

/* ---------- ROUTER ---------- */
let route = {view:'home'};
function navigate(view, stageNum, lessonNum){
  route = {view, stageNum, lessonNum};
  closeMobileNav();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  const hash = view==='home' ? '#/' : view==='stage' ? `#/stage/${stageNum}` : view==='lesson' ? `#/stage/${stageNum}/lesson/${lessonNum}` : view==='project' ? `#/stage/${stageNum}/project` : `#/${view}`;
  history.pushState(null,'',hash);
}
window.addEventListener('popstate', ()=>{ parseHash(); render(); });
function parseHash(){
  const h = location.hash.replace('#/','');
  const parts = h.split('/').filter(Boolean);
  if(parts.length===0){ route={view:'home'}; return; }
  if(parts[0]==='stage' && parts[1]){
    const sn = parseInt(parts[1]);
    if(parts[2]==='lesson' && parts[3]){ route={view:'lesson', stageNum:sn, lessonNum:parseInt(parts[3])}; return; }
    if(parts[2]==='project'){ route={view:'project', stageNum:sn}; return; }
    route={view:'stage', stageNum:sn}; return;
  }
  if(parts[0]==='resources'){ route={view:'resources'}; return; }
  route={view:'home'};
}

function getStage(n){ return DATA.stages.find(s=>s.number===n); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- ICONS ---------- */
const ICONS = {
  learn:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20l-8-4V6l8-4 8 4v10z"/><path d="M4 6l8 4 8-4"/></svg>',
  why:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
  lesson:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  terms:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.6l-8.2 8.2a2 2 0 01-2.8 0l-6.4-6.4a2 2 0 010-2.8l8.2-8.2A2 2 0 0112.8 3H19a2 2 0 012 2v6.2a2 2 0 01-.4 1.4z"/><circle cx="14.5" cy="8.5" r="1.5"/></svg>',
  mistake:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  try:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.8-3.8a5 5 0 01-6.7 6.7l-6.9 6.9a2 2 0 01-2.8-2.8l6.9-6.9a5 5 0 016.7-6.7l-3.8 3.8z"/></svg>',
  assignment:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  further:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  checkmark:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>',
  seed:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="var(--sage-soft)"/><ellipse cx="24" cy="30" rx="9" ry="12" fill="var(--sage)"/><path d="M24 18c0-6 4-9 4-9" stroke="var(--terracotta)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>',
  sprout:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="var(--gold-soft)"/><path d="M24 34V16" stroke="var(--sage)" stroke-width="3" stroke-linecap="round"/><path d="M24 22c-6-2-8-8-8-8s8 0 8 8Z" fill="var(--sage)"/><path d="M24 26c6-2 8-8 8-8s-8 0-8 8Z" fill="var(--sage)"/></svg>',
  tree:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="var(--terracotta-soft)"/><rect x="21" y="28" width="6" height="12" rx="2" fill="#8a5a3a"/><circle cx="24" cy="20" r="12" fill="var(--sage)"/><circle cx="16" cy="24" r="8" fill="var(--sage)"/><circle cx="32" cy="24" r="8" fill="var(--sage)"/></svg>',
  trophy:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="var(--gold-soft)"/><path d="M16 14h16v8a8 8 0 01-16 0v-8z" fill="var(--gold)"/><path d="M16 16h-4v4a4 4 0 004 4M32 16h4v4a4 4 0 01-4 4" stroke="var(--terracotta-deep)" stroke-width="2" fill="none"/><rect x="20" y="30" width="8" height="6" fill="var(--terracotta-deep)"/><rect x="16" y="36" width="16" height="3" rx="1.5" fill="var(--terracotta-deep)"/></svg>',
};

/* ---------- RENDER: HOME ---------- */
function renderHome(){
  const w = DATA.welcome;
  return `
  <section class="hero">
    <div class="wrap">
      <div class="hero-badge">✨ ${DATA.stages.length} stages · ${totalLessons()} lessons · real deployed projects</div>
      <h1>${esc(DATA.courseTitle).replace('Full Stack Web Development','Full Stack <em>Web Development</em>')}</h1>
      <p class="hero-sub">${w.intro.map(esc).join(' ')}</p>
      <div class="hero-avatar-zone">
        <div style="width:150px;height:150px;" id="heroMascotSlot"></div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="navigate('stage',1)">Begin Your Journey ${ICONS.arrow}</button>
        <button class="btn btn-ghost" onclick="navigate('resources')">Browse Resources</button>
      </div>
      <div class="stats-row">
        <div class="stat-pill"><b>24</b><span>Weeks</span></div>
        <div class="stat-pill"><b>${totalLessons()}</b><span>Lessons</span></div>
        <div class="stat-pill"><b>3</b><span>Real Projects</span></div>
        <div class="stat-pill"><b>${overallPct()}%</b><span>Your Progress</span></div>
      </div>
    </div>
  </section>

  <section class="section reveal">
    <div class="wrap">
      <div class="section-head">
        <div class="section-eyebrow">What you'll walk away with</div>
        <h2>Not certificates. Proof.</h2>
      </div>
      <div class="walk-grid">
        ${w.walkAway.map((item,i)=>`<div class="walk-card"><div class="walk-num">${i+1}</div><p>${item}</p></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="section reveal">
    <div class="wrap">
      <div class="section-head">
        <div class="section-eyebrow">Your path</div>
        <h2>Three stages. One transformation.</h2>
      </div>
      <div class="stage-grid">
        ${DATA.stages.map(renderStageCard).join('')}
      </div>
    </div>
  </section>`;
}

function renderStageCard(stage){
  const pct = stagePct(stage);
  const r = 24, circ = 2*Math.PI*r;
  const offset = circ - (pct/100)*circ;
  return `
  <div class="stage-card reveal in" onclick="navigate('stage', ${stage.number})">
    <div class="stage-top">
      <div class="stage-icon">${ICONS[stage.icon]}</div>
      <div class="stage-ring">
        <svg width="54" height="54"><circle class="bg" cx="27" cy="27" r="${r}"/><circle class="fg" cx="27" cy="27" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/></svg>
        <div class="stage-ring-label">${pct}%</div>
      </div>
    </div>
    <div class="stage-range">${stage.range} · ${stage.name}</div>
    <h3>${esc(stage.subtitle)}</h3>
    <div class="stage-subtitle">Stage ${stage.number}</div>
    <p class="blurb">${esc(stage.blurb)}</p>
    <div class="stage-meta">
      <div class="stage-lessoncount">${stage.lessons.length} lessons · 1 capstone project</div>
      <div class="stage-go">Explore ${ICONS.arrow}</div>
    </div>
  </div>`;
}

/* ---------- RENDER: STAGE ---------- */
function renderStage(stageNum){
  const stage = getStage(stageNum);
  if(!stage) return renderHome();
  const pct = stagePct(stage);
  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb"><button onclick="navigate('home')">Home</button> / <span>Stage ${stage.number} — ${stage.name}</span></div>
      <div class="stage-header reveal in">
        <div class="stage-range">${stage.range}</div>
        <h1>${esc(stage.subtitle)}</h1>
        <div class="subtitle">${esc(stage.blurb)}</div>
        ${stage.intro}
        <div class="stage-progress-bar">
          <div class="nav-progress-track" style="width:100%;"><div class="nav-progress-fill" style="width:${pct}%;"></div></div>
          <div style="font-size:.78rem; font-weight:700; color:var(--ink-soft); margin-top:6px;">${stageCompletedCount(stage)} of ${stage.lessons.length} lessons complete</div>
        </div>
      </div>
      <div class="filter-row">
        <input class="filter-input" id="lessonFilter" placeholder="Search lessons in this stage…" oninput="filterLessons()">
      </div>
      <div class="lesson-grid" id="lessonGrid">
        ${stage.lessons.map(l=>renderLessonCard(stage,l)).join('')}
      </div>
      ${stage.project ? renderProjectCard(stage) : ''}
    </div>
  </section>`;
}

function renderLessonCard(stage, lesson){
  const done = !!progress.lessons[stage.id+'-'+lesson.number];
  return `
  <div class="lesson-card ${done?'done':''}" data-title="${esc(lesson.title).toLowerCase()}" onclick="navigate('lesson', ${stage.number}, ${lesson.number})">
    <div class="lesson-card-top">
      <div class="lesson-num">${lesson.number}</div>
      <div class="lesson-check">${ICONS.checkmark}</div>
    </div>
    <h4>${esc(lesson.title)}</h4>
    <div class="lesson-tags">${lesson.keyTerms.slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  </div>`;
}
function filterLessons(){
  const q = document.getElementById('lessonFilter').value.toLowerCase();
  document.querySelectorAll('#lessonGrid .lesson-card').forEach(c=>{
    c.style.display = c.dataset.title.includes(q) ? '' : 'none';
  });
}

function renderProjectCard(stage){
  const done = !!progress.projects[stage.id];
  return `
  <div class="project-card ${done?'done':''}" onclick="navigate('project', ${stage.number})">
    <div class="project-icon">${ICONS.trophy}</div>
    <div class="flex1">
      <span class="project-badge">Stage ${stage.number} Capstone ${done?'· Completed ✓':''}</span>
      <h4>${esc(stage.project.title)}</h4>
      <p style="margin:0;">${esc(stage.project.lead)}</p>
    </div>
    <div class="stage-go">View project ${ICONS.arrow}</div>
  </div>`;
}

/* ---------- RENDER: LESSON ---------- */
function renderLesson(stageNum, lessonNum){
  const stage = getStage(stageNum);
  if(!stage) return renderHome();
  const lesson = stage.lessons.find(l=>l.number===lessonNum);
  if(!lesson) return renderStage(stageNum);
  const key = stage.id+'-'+lesson.number;
  const done = !!progress.lessons[key];
  const nextLesson = stage.lessons.find(l=>l.number===lessonNum+1);

  const navItems = stage.lessons.map(l=>{
    const d = !!progress.lessons[stage.id+'-'+l.number];
    const active = l.number===lessonNum;
    return `<div class="lesson-nav-item ${active?'active':''} ${d?'done':''}" onclick="navigate('lesson', ${stage.number}, ${l.number})"><span class="lesson-nav-dot"></span> ${l.number}. ${esc(l.title)}</div>`;
  }).join('') + `<div class="lesson-nav-item" onclick="navigate('project', ${stage.number})"><span class="lesson-nav-dot"></span> 🏆 Capstone Project</div>`;

  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb">
        <button onclick="navigate('home')">Home</button> /
        <button onclick="navigate('stage', ${stage.number})">Stage ${stage.number}</button> /
        <span>Lesson ${lesson.number}</span>
      </div>
      <div class="lesson-layout">
        <aside class="lesson-nav">${navItems}</aside>
        <div class="lesson-main">
          <div class="lesson-hero reveal in">
            <div class="lesson-eyebrow">${ICONS[stage.icon]} Stage ${stage.number} · Lesson ${lesson.number} of ${stage.lessons.length}</div>
            <h1>${esc(lesson.title)}</h1>
          </div>

          <div class="card-block block-learn">
            <h3>${ICONS.learn} What you'll learn</h3>
            <ul class="plain-list">${lesson.whatYoullLearn.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>

          <div class="card-block block-why">
            <h3>${ICONS.why} Why this matters</h3>
            ${lesson.whyThisMatters}
          </div>

          <div class="card-block block-lesson">
            <h3>${ICONS.lesson} The Lesson</h3>
            ${lesson.lessonContent}
          </div>

          <div class="card-block">
            <h3>${ICONS.terms} Key terms you need to know</h3>
            <div class="term-grid">${lesson.keyTerms.map(t=>`<span class="term-chip">${esc(t)}</span>`).join('')}</div>
          </div>

          <div class="card-block block-mistakes">
            <h3>${ICONS.mistake} Mistakes learners make at this stage</h3>
            <ul class="plain-list">${lesson.mistakes.map(i=>`<li>${i}</li>`).join('')}</ul>
          </div>

          <div class="card-block block-try">
            <h3>${ICONS.try} Try it yourself</h3>
            ${lesson.tryItYourself}
          </div>

          <div class="card-block block-assignment">
            <h3>${ICONS.assignment} Your assignment</h3>
            ${lesson.assignment}
          </div>

          <div class="card-block">
            <h3>${ICONS.check} Check yourself before moving on</h3>
            <ul class="check-list">
              ${lesson.checkYourself.map((c,i)=>{
                const ckey = key+'-c'+i;
                const checked = !!progress.checks[ckey];
                return `<li class="checkitem ${checked?'checked':''}" onclick="toggleCheck('${ckey}', this)"><span class="checkbox">${ICONS.checkmark}</span><span class="ctext">${c}</span></li>`;
              }).join('')}
            </ul>
          </div>

          <div class="card-block">
            <h3>${ICONS.further} Go further</h3>
            <div class="gofurther-list">${lesson.goFurther.map(g=>`<div>${g}</div>`).join('')}</div>
          </div>

          <div class="lesson-footer">
            <button class="complete-btn ${done?'is-done':''}" onclick="toggleLessonDone('${key}', this)">
              ${ICONS.checkmark} ${done? 'Marked Complete' : 'Mark Lesson Complete'}
            </button>
            ${nextLesson ? `<button class="next-btn" onclick="navigate('lesson', ${stage.number}, ${nextLesson.number})">Next: ${esc(nextLesson.title)} ${ICONS.arrow}</button>`
              : `<button class="next-btn" onclick="navigate('project', ${stage.number})">Go to Capstone Project ${ICONS.arrow}</button>`}
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function toggleCheck(key, el){
  progress.checks[key] = !progress.checks[key];
  saveProgress(progress);
  el.classList.toggle('checked');
}

function toggleLessonDone(key, btn){
  const wasDone = !!progress.lessons[key];
  progress.lessons[key] = !wasDone;
  saveProgress(progress);
  updateNavProgress();
  if(!wasDone){
    btn.classList.add('is-done');
    btn.innerHTML = ICONS.checkmark + ' Marked Complete';
    confettiBurst();
    mascotSay("Nice work — that's one more in the bag! 🎉");
  } else {
    btn.classList.remove('is-done');
    btn.innerHTML = ICONS.checkmark + ' Mark Lesson Complete';
  }
}
function mascotSay(text){
  const el = document.getElementById('mascotSpeech');
  el.textContent = text; el.classList.add('show');
  clearTimeout(window.__mto);
  window.__mto = setTimeout(()=>el.classList.remove('show'), 3200);
}

/* ---------- RENDER: PROJECT ---------- */
function renderProject(stageNum){
  const stage = getStage(stageNum);
  if(!stage || !stage.project) return renderStage(stageNum);
  const p = stage.project;
  const done = !!progress.projects[stage.id];
  const assessItems = p.assess.split('·').map(s=>s.trim()).filter(Boolean);

  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb">
        <button onclick="navigate('home')">Home</button> /
        <button onclick="navigate('stage', ${stage.number})">Stage ${stage.number}</button> /
        <span>Capstone Project</span>
      </div>
      <div class="project-hero reveal in">
        <div style="width:70px;height:70px;margin:0 auto 14px;">${ICONS.trophy}</div>
        <span class="project-badge">Stage ${stage.number} Capstone</span>
        <h1>${esc(p.title)}</h1>
        <p style="max-width:520px;margin:0 auto;">${esc(p.lead)}</p>
      </div>

      <div class="card-block">
        <h3>${ICONS.assignment} What you'll build</h3>
        <ul class="plain-list">${p.build.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>

      <div class="card-block">
        <h3>${ICONS.check} How you'll be assessed</h3>
        <div class="assess-bars">
          ${assessItems.map(item=>{
            const m = item.match(/^(.*)\((\d+)%\)$/);
            const label = m?m[1].trim():item;
            const pct = m?m[2]:'—';
            return `<div class="assess-bar-row"><div class="assess-bar-label">${esc(label)}</div><div class="assess-bar-track"><div class="assess-bar-fill" style="width:${pct}%"></div></div><div class="assess-bar-pct">${pct}%</div></div>`;
          }).join('')}
        </div>
      </div>

      ${p.extra?`<div class="card-block block-why"><h3>${ICONS.why} Good to know</h3>${p.extra}</div>`:''}

      <div class="lesson-footer">
        <button class="complete-btn ${done?'is-done':''}" onclick="toggleProjectDone('${stage.id}', this)">
          ${ICONS.trophy} ${done? 'Capstone Complete!' : 'Mark Capstone Complete'}
        </button>
        <button class="next-btn" onclick="navigate('home')">Back to Overview ${ICONS.arrow}</button>
      </div>
    </div>
  </section>`;
}
function toggleProjectDone(stageId, btn){
  const wasDone = !!progress.projects[stageId];
  progress.projects[stageId] = !wasDone;
  saveProgress(progress);
  if(!wasDone){
    btn.classList.add('is-done');
    btn.innerHTML = ICONS.trophy + ' Capstone Complete!';
    confettiBurst(); setTimeout(confettiBurst, 300);
    mascotSay("A whole stage, done. That's huge. 🌟");
  } else {
    btn.classList.remove('is-done');
    btn.innerHTML = ICONS.trophy + ' Mark Capstone Complete';
  }
}

/* ---------- RENDER: RESOURCES ---------- */
function renderResources(){
  const a = DATA.appendix;
  return `
  <section class="section" style="padding-top:34px;">
    <div class="wrap">
      <div class="crumb"><button onclick="navigate('home')">Home</button> / <span>Resources</span></div>
      <div class="section-head" style="text-align:left; margin:0 0 30px;">
        <div class="section-eyebrow">For you to keep</div>
        <h2>Glossary & Growth</h2>
      </div>
      ${Object.entries(a).map(([heading, body])=>`
        <div class="card-block">
          <h3 style="font-size:1.05rem; text-transform:none; letter-spacing:0;">${esc(heading)}</h3>
          ${body}
        </div>
      `).join('')}
    </div>
  </section>`;
}

/* ---------- MAIN RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(route.view==='home') html = renderHome();
  else if(route.view==='stage') html = renderStage(route.stageNum);
  else if(route.view==='lesson') html = renderLesson(route.stageNum, route.lessonNum);
  else if(route.view==='project') html = renderProject(route.stageNum);
  else if(route.view==='resources') html = renderResources();
  else html = renderHome();
  app.innerHTML = html;
  updateNavProgress();
  setupReveal();
}

function setupReveal(){
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.1});
  els.forEach(el=>io.observe(el));
}

/* ---------- MOBILE NAV ---------- */
function closeMobileNav(){
  document.getElementById('navOverlay').classList.remove('show');
  document.getElementById('navPanel').classList.remove('show');
}
document.getElementById('mobileMenuBtn').addEventListener('click', ()=>{
  document.getElementById('navOverlay').classList.add('show');
  document.getElementById('navPanel').classList.add('show');
});
document.getElementById('navOverlay').addEventListener('click', closeMobileNav);

/* ---------- THEME ---------- */
function initTheme(){
  const saved = localStorage.getItem('webdev_theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('webdev_theme', next); }catch(e){}
});

/* ---------- INIT ---------- */
try{ initTheme(); }catch(e){}
parseHash();
render();
setTimeout(()=>{ mascotSay("Hi! I'm your learning buddy. Tap me anytime. 👋"); }, 1200);
</script>
</body>
</html>
