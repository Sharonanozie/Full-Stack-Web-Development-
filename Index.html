<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF1E2; --cream-deep:#F3E3C9; --card:#FFFCF6;
  --ink:#3A2A1E; --ink-soft:#6E5A48; --ink-faint:#9C8770;
  --terracotta:#D9622F; --terracotta-deep:#B84A1E; --terracotta-soft:#F3D3BE;
  --gold:#E4A030; --gold-soft:#F7E3B8;
  --rose:#D98A87; --rose-soft:#F5DAD6;
  --sage:#7C9A6C; --sage-soft:#DCE7D2;
  --line:rgba(58,42,30,.12);
  --shadow:0 10px 30px rgba(58,42,30,.10);
  --shadow-lg:0 20px 50px rgba(58,42,30,.16);
  --radius:22px; --radius-sm:14px;
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --cream:#241a13; --cream-deep:#2e2119; --card:#2c2018;
    --ink:#F3E3C9; --ink-soft:#D8C4A8; --ink-faint:#a58e73;
    --terracotta-soft:#4a2c1c; --gold-soft:#4a3a1c; --rose-soft:#3f2a29; --sage-soft:#293a24;
    --line:rgba(243,227,201,.14);
    --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --cream:#241a13; --cream-deep:#2e2119; --card:#2c2018;
  --ink:#F3E3C9; --ink-soft:#D8C4A8; --ink-faint:#a58e73;
  --terracotta-soft:#4a2c1c; --gold-soft:#4a3a1c; --rose-soft:#3f2a29; --sage-soft:#293a24;
  --line:rgba(243,227,201,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top: calc(78px + env(safe-area-inset-top,0px));}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
