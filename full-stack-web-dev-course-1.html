<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Stack Web Development — Your Learning Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF1E2; --cream-deep:#F3E3C9; --card:#FFFCF6;
  --ink:#3A2A1E; --ink-soft:#6E5A48; --ink-faint:#9C8770;
  --terracotta:#D9622F; --terracotta-deep:#B84A1E; --terracotta-soft:#F3D3BE;
  --gold:#E4A030; --gold-soft:#F7E3B8;
  --rose:#D98A87; --rose-soft:#F5DAD6;
  --sage:#7C9A6C; --sage-soft:#DCE7D2;
  --line:rgba(58,42,30,.12);
  --shadow:0 10px 30px rgba(58,42,30,.10);
  --shadow-lg:0 20px 50px rgba(58,42,30,.16);
  --radius:22px; --radius-sm:14px;
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --cream:#241a13; --cream-deep:#2e2119; --card:#2c2018;
    --ink:#F3E3C9; --ink-soft:#D8C4A8; --ink-faint:#a58e73;
    --terracotta-soft:#4a2c1c; --gold-soft:#4a3a1c; --rose-soft:#3f2a29; --sage-soft:#293a24;
    --line:rgba(243,227,201,.14);
    --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --cream:#241a13; --cream-deep:#2e2119; --card:#2c2018;
  --ink:#F3E3C9; --ink-soft:#D8C4A8; --ink-faint:#a58e73;
  --terracotta-soft:#4a2c1c; --gold-soft:#4a3a1c; --rose-soft:#3f2a29; --sage-soft:#293a24;
  --line:rgba(243,227,201,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top: calc(78px + env(safe-area-inset-top,0px));}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-.01em;}
p{line-height:1.7; color:var(--ink-soft); margin:0 0 1em;}
a{color:var(--terracotta-deep);}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold-soft);}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
img{max-width:100%;}

/* ============ BACKGROUND BLOBS ============ */
.bg-blobs{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
.blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; animation:drift 22s ease-in-out infinite;}
.blob.b1{width:420px;height:420px; background:var(--terracotta-soft); top:-120px; left:-100px; animation-delay:0s;}
.blob.b2{width:340px;height:340px; background:var(--gold-soft); top:20%; right:-120px; animation-delay:-6s;}
.blob.b3{width:380px;height:380px; background:var(--rose-soft); bottom:-140px; left:20%; animation-delay:-12s;}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(30px,-40px) scale(1.08);}
  66%{transform:translate(-25px,25px) scale(.95);}
}

/* ============ TOP NAV ============ */
.topnav{
  position:sticky; top:0; z-index:50;
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb, var(--cream) 88%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.topnav-inner{max-width:1120px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px;}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:0;}
.brand-mark{width:36px;height:36px; flex:none;}
.brand-text{font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem; color:var(--ink);}
.brand-text small{display:block; font-family:'Plus Jakarta Sans'; font-weight:500; font-size:.68rem; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase;}
.nav-spacer{flex:1;}
.nav-progress{display:flex; align-items:center; gap:10px; margin-right:6px;}
.nav-progress-track{width:120px; height:8px; border-radius:99px; background:var(--cream-deep); overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.08);}
.nav-progress-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--terracotta)); width:0%; transition:width .8s cubic-bezier(.22,1,.36,1);}
.nav-progress-label{font-size:.72rem; font-weight:700; color:var(--ink-soft); white-space:nowrap;}
.icon-btn{
  width:38px;height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; transition:transform .25s, box-shadow .25s;
}
.icon-btn:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
.icon-btn svg{width:18px;height:18px;}

/* ============ HERO ============ */
.hero{padding:70px 24px 40px; text-align:center; position:relative;}
.hero-badge{
  display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:99px;
  background:var(--card); border:1px solid var(--line); font-size:.78rem; font-weight:700;
  color:var(--terracotta-deep); margin-bottom:26px; box-shadow:var(--shadow);
  animation:fadeInUp .7s ease both;
}
.hero h1{
  font-size:clamp(2.3rem, 6vw, 4.2rem); line-height:1.04; margin-bottom:18px;
  animation:fadeInUp .8s .05s ease both;
}
.hero h1 em{font-style:italic; color:var(--terracotta);}
.hero-sub{
  max-width:600px; margin:0 auto 34px; font-size:1.12rem; color:var(--ink-soft);
  animation:fadeInUp .8s .12s ease both;
}
.hero-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:52px; animation:fadeInUp .8s .18s ease both;}
.btn{
  border:none; border-radius:99px; padding:15px 30px; font-weight:700; font-size:.98rem;
  display:inline-flex; align-items:center; gap:8px; transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s;
}
.btn-primary{background:linear-gradient(135deg,var(--terracotta),var(--terracotta-deep)); color:#fff; box-shadow:0 10px 24px rgba(217,98,47,.35);}
.btn-primary:hover{transform:translateY(-3px) scale(1.02); box-shadow:0 16px 32px rgba(217,98,47,.42);}
.btn-ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
.btn:active{transform:translateY(0) scale(.98);}

.hero-avatar-zone{position:relative; height:190px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; animation:fadeInUp .9s .22s ease both;}
.mascot{width:150px;height:150px; animation:bob 4.5s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-14px) rotate(2deg);}}
.mascot .eye{animation:blink 5s infinite;}
@keyframes blink{0%,92%,100%{transform:scaleY(1);} 96%{transform:scaleY(.1);}}
.sparkle{position:absolute; animation:sparkle 2.6s ease-in-out infinite;}
@keyframes sparkle{0%,100%{opacity:.2; transform:scale(.6) rotate(0deg);} 50%{opacity:1; transform:scale(1.1) rotate(25deg);}}

.stats-row{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; animation:fadeInUp .9s .28s ease both;}
.stat-pill{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 22px;
  min-width:120px; box-shadow:var(--shadow);
}
.stat-pill b{display:block; font-family:'Fraunces',serif; font-size:1.5rem; color:var(--terracotta-deep);}
.stat-pill span{font-size:.75rem; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}

@keyframes fadeInUp{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:translateY(0);}}
.reveal{opacity:0; transform:translateY(28px); transition:opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);}
.reveal.in{opacity:1; transform:translateY(0);}

/* ============ SECTION HEADERS ============ */
.section{padding:64px 24px;}
.section-head{text-align:center; max-width:640px; margin:0 auto 40px;}
.section-eyebrow{font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--terracotta);}
.section-head h2{font-size:clamp(1.7rem,3.6vw,2.4rem); margin-top:8px;}

/* ============ WALKAWAY CARDS ============ */
.walk-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; max-width:1000px; margin:0 auto;}
.walk-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px; box-shadow:var(--shadow); transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s;
}
.walk-card:hover{transform:translateY(-6px) rotate(-.5deg); box-shadow:var(--shadow-lg);}
.walk-num{
  width:34px;height:34px; border-radius:10px; background:var(--gold-soft); color:var(--terracotta-deep);
  display:flex; align-items:center; justify-content:center; font-weight:800; margin-bottom:14px; font-family:'Fraunces',serif;
}
.walk-card p{margin:0; color:var(--ink); font-weight:500; font-size:.95rem;}

/* ============ STAGE CARDS ============ */
.stage-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px;}
.stage-card{
  background:var(--card); border:1px solid var(--line); border-radius:28px; padding:30px;
  cursor:pointer; position:relative; overflow:hidden; box-shadow:var(--shadow);
  transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s;
}
.stage-card:hover{transform:translateY(-8px) scale(1.015); box-shadow:var(--shadow-lg);}
.stage-card::after{
  content:''; position:absolute; inset:0; opacity:0; background:radial-gradient(circle at 80% 0%, var(--gold-soft), transparent 60%);
  transition:opacity .35s;
}
.stage-card:hover::after{opacity:1;}
.stage-top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; position:relative;}
.stage-icon{width:52px;height:52px;}
.stage-ring{position:relative; width:54px;height:54px;}
.stage-ring svg{transform:rotate(-90deg);}
.stage-ring circle{fill:none; stroke-width:5;}
.stage-ring .bg{stroke:var(--cream-deep);}
.stage-ring .fg{stroke:var(--terracotta); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1);}
.stage-ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:800; color:var(--terracotta-deep);}
.stage-range{font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px;}
.stage-card h3{font-size:1.5rem; margin-bottom:4px; position:relative;}
.stage-card .stage-subtitle{font-size:.85rem; color:var(--terracotta-deep); font-weight:700; margin-bottom:12px;}
.stage-card p.blurb{font-size:.92rem; margin-bottom:18px; position:relative;}
.stage-meta{display:flex; align-items:center; justify-content:space-between; position:relative;}
.stage-lessoncount{font-size:.78rem; font-weight:700; color:var(--ink-faint);}
.stage-go{display:flex; align-items:center; gap:6px; font-weight:700; font-size:.85rem; color:var(--terracotta-deep);}
.stage-go svg{width:16px;height:16px; transition:transform .25s;}
.stage-card:hover .stage-go svg{transform:translateX(4px);}

/* ============ BREADCRUMB / STAGE VIEW ============ */
.crumb{display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--ink-faint); margin-bottom:26px; flex-wrap:wrap;}
.crumb button{background:none; border:none; color:var(--terracotta-deep); font-weight:700; padding:0;}
.crumb button:hover{text-decoration:underline;}
.stage-header{margin-bottom:36px;}
.stage-header .stage-range{margin-bottom:10px;}
.stage-header h1{font-size:clamp(1.9rem,4vw,2.7rem); margin-bottom:10px;}
.stage-header .subtitle{color:var(--terracotta-deep); font-weight:700; margin-bottom:14px;}
.stage-progress-bar{max-width:420px; margin-top:18px;}

.filter-row{display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; align-items:center;}
.filter-input{
  flex:1; min-width:200px; padding:12px 18px; border-radius:99px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:inherit; font-size:.92rem;
}
.filter-input:focus{outline:2px solid var(--terracotta-soft);}

.lesson-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-bottom:26px;}
.lesson-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px;
  cursor:pointer; transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:12px; position:relative;
}
.lesson-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg);}
.lesson-card.done{background:linear-gradient(160deg, var(--sage-soft), var(--card) 60%);}
.lesson-card-top{display:flex; align-items:center; justify-content:space-between;}
.lesson-num{
  width:36px;height:36px; border-radius:11px; background:var(--terracotta-soft); color:var(--terracotta-deep);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Fraunces',serif; font-size:.95rem;
}
.lesson-check{
  width:26px;height:26px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  transition:all .3s;
}
.lesson-card.done .lesson-check{background:var(--sage); border-color:var(--sage);}
.lesson-check svg{width:14px;height:14px; opacity:0; transition:opacity .2s; stroke:#fff;}
.lesson-card.done .lesson-check svg{opacity:1;}
.lesson-card h4{font-size:1.05rem; line-height:1.3;}
.lesson-tags{display:flex; flex-wrap:wrap; gap:6px;}
.tag{
  font-size:.68rem; font-weight:700; background:var(--cream-deep); color:var(--ink-soft);
  padding:4px 10px; border-radius:99px;
}
.project-card{
  background:linear-gradient(135deg, var(--gold-soft), var(--rose-soft));
  border:1px solid var(--line); border-radius:var(--radius); padding:28px; cursor:pointer;
  transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.project-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg);}
.project-icon{width:56px;height:56px; flex:none;}
.project-card h4{font-size:1.3rem; margin-bottom:4px;}
.project-card .flex1{flex:1; min-width:200px;}
.project-badge{
  font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--terracotta-deep);
  margin-bottom:6px; display:block;
}

/* ============ LESSON DETAIL ============ */
.lesson-layout{display:grid; grid-template-columns:220px 1fr; gap:40px; align-items:flex-start;}
@media (max-width:820px){.lesson-layout{grid-template-columns:1fr;}}
.lesson-nav{
  position:sticky; top:96px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:16px; max-height:70vh; overflow-y:auto;
}
.lesson-nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; font-size:.82rem;
  font-weight:600; color:var(--ink-soft); cursor:pointer; transition:background .2s;
}
.lesson-nav-item:hover{background:var(--cream-deep);}
.lesson-nav-item.active{background:var(--terracotta-soft); color:var(--terracotta-deep);}
.lesson-nav-dot{width:8px;height:8px;border-radius:50%; background:var(--line); flex:none;}
.lesson-nav-item.done .lesson-nav-dot{background:var(--sage);}
.lesson-nav-item.active .lesson-nav-dot{background:var(--terracotta);}

.lesson-main{min-width:0;}
.lesson-hero{margin-bottom:30px;}
.lesson-eyebrow{font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--terracotta-deep); display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.lesson-hero h1{font-size:clamp(1.7rem,4vw,2.5rem); margin-bottom:16px;}

.card-block{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px;
  margin-bottom:22px; box-shadow:var(--shadow); animation:fadeInUp .5s ease both;
}
.card-block h3{
  font-size:1.02rem; display:flex; align-items:center; gap:10px; margin-bottom:14px; color:var(--ink);
  font-family:'Plus Jakarta Sans'; font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:.82rem;
}
.card-block h3 .ic{width:20px;height:20px; flex:none;}
.block-learn{background:var(--card);}
.block-why{background:linear-gradient(135deg, var(--rose-soft), var(--card) 70%); border-left:4px solid var(--rose);}
.block-why h3{color:var(--terracotta-deep);}
.block-why p{color:var(--ink); font-style:italic; font-size:1.02rem;}
.block-lesson{padding-bottom:8px;}
.block-lesson p{color:var(--ink); font-size:1rem;}
.block-lesson ul,.block-lesson ol{color:var(--ink); padding-left:22px; line-height:1.8; margin:0 0 1em;}
.block-lesson li{margin-bottom:6px;}
.block-mistakes{background:linear-gradient(135deg, var(--gold-soft), var(--card) 70%); border-left:4px solid var(--gold);}
.block-try{background:linear-gradient(135deg, var(--sage-soft), var(--card) 70%); border-left:4px solid var(--sage);}
.block-assignment{background:linear-gradient(135deg, var(--terracotta-soft), var(--card) 70%); border-left:4px solid var(--terracotta);}

ul.check-list, ul.plain-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
ul.plain-list li{display:flex; gap:10px; align-items:flex-start; font-size:.95rem; color:var(--ink);}
ul.plain-list li::before{content:'✦'; color:var(--terracotta); flex:none; margin-top:2px;}

.checkitem{
  display:flex; align-items:flex-start; gap:12px; padding:10px 12px; border-radius:12px; cursor:pointer;
  transition:background .2s; font-size:.95rem; color:var(--ink);
}
.checkitem:hover{background:var(--cream-deep);}
.checkbox{
  width:22px;height:22px; border-radius:7px; border:2px solid var(--ink-faint); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.checkitem.checked .checkbox{background:var(--sage); border-color:var(--sage);}
.checkbox svg{width:12px;height:12px; opacity:0; stroke:#fff; transition:opacity .15s;}
.checkitem.checked .checkbox svg{opacity:1;}
.checkitem.checked span.ctext{color:var(--ink-faint); text-decoration:line-through;}

.term-grid{display:flex; flex-wrap:wrap; gap:8px;}
.term-chip{
  background:var(--cream-deep); color:var(--ink); padding:7px 14px; border-radius:99px; font-size:.82rem; font-weight:700;
  border:1px solid var(--line); transition:transform .2s, background .2s;
}
.term-chip:hover{transform:translateY(-2px) scale(1.04); background:var(--gold-soft);}

.gofurther-list{display:flex; flex-direction:column; gap:8px;}
.gofurther-list div{font-size:.9rem; color:var(--ink-soft); padding-left:22px; position:relative;}
.gofurther-list div::before{content:'📚'; position:absolute; left:0;}

pre.code-block{
  background:#2A2019; color:#F3E3C9; border-radius:14px; padding:18px 20px; overflow-x:auto;
  font-family:'JetBrains Mono',monospace; font-size:.83rem; line-height:1.65; margin:16px 0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
pre.code-block code{background:none; padding:0; color:inherit;}
.table-wrap{overflow-x:auto; margin:16px 0; border-radius:14px; border:1px solid var(--line);}
.table-wrap table{width:100%; border-collapse:collapse; font-size:.88rem;}
.table-wrap th{background:var(--terracotta-soft); color:var(--terracotta-deep); text-align:left; padding:10px 14px; font-weight:800; white-space:nowrap;}
.table-wrap td{padding:10px 14px; border-top:1px solid var(--line); color:var(--ink);}
.table-wrap tr:nth-child(even) td{background:var(--cream-deep);}
.block-lesson code, p code{
  background:var(--gold-soft); color:var(--terracotta-deep); padding:2px 7px; border-radius:6px;
  font-family:'JetBrains Mono',monospace; font-size:.85em;
}

.lesson-footer{display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:10px; flex-wrap:wrap;}
.complete-btn{
  background:linear-gradient(135deg,var(--sage),#6a8a58); color:#fff; border-radius:99px; padding:16px 30px;
  font-weight:800; font-size:.95rem; border:none; display:flex; align-items:center; gap:10px;
  box-shadow:0 10px 24px rgba(124,154,108,.35); transition:transform .25s, box-shadow .25s;
}
.complete-btn.is-done{background:linear-gradient(135deg,var(--ink-faint),var(--ink-soft));}
.complete-btn:hover{transform:translateY(-3px) scale(1.02);}
.next-btn{
  background:var(--card); border:1px solid var(--line); border-radius:99px; padding:16px 26px; font-weight:700;
  display:flex; align-items:center; gap:8px; color:var(--ink); transition:transform .25s, box-shadow .25s;
}
.next-btn:hover{transform:translateY(-3px); box-shadow:var(--shadow);}

/* ============ PROJECT VIEW ============ */
.project-hero{
  background:linear-gradient(135deg, var(--gold-soft), var(--rose-soft)); border-radius:28px; padding:40px;
  margin-bottom:28px; text-align:center; position:relative; overflow:hidden;
}
.project-hero h1{font-size:clamp(1.7rem,4vw,2.4rem); margin:10px 0;}
.assess-bars{display:flex; flex-direction:column; gap:12px;}
.assess-bar-row{display:flex; align-items:center; gap:14px;}
.assess-bar-label{font-size:.85rem; font-weight:700; width:230px; flex:none; color:var(--ink);}
.assess-bar-track{flex:1; height:10px; background:var(--cream-deep); border-radius:99px; overflow:hidden;}
.assess-bar-fill{height:100%; background:linear-gradient(90deg,var(--terracotta),var(--gold)); border-radius:99px; width:0%; transition:width 1.2s cubic-bezier(.22,1,.36,1);}
.assess-bar-pct{width:44px; text-align:right; font-weight:800; font-size:.82rem; color:var(--terracotta-deep);}

/* ============ RESOURCES ============ */
.glossary-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
.glossary-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow);}

/* ============ FOOTER ============ */
footer{padding:50px 24px 80px; text-align:center; color:var(--ink-faint); font-size:.85rem;}

/* ============ MASCOT WIDGET (floating) ============ */
.mascot-fab{
  position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px)); right:22px; z-index:60;
  width:64px;height:64px; cursor:pointer; filter:drop-shadow(0 8px 18px rgba(0,0,0,.18));
  animation:bob 4.5s ease-in-out infinite; transition:transform .3s;
}
.mascot-fab:hover{transform:scale(1.1);}
.mascot-speech{
  position:fixed; bottom:calc(92px + env(safe-area-inset-bottom,0px)); right:22px; z-index:60;
  background:var(--card); border:1px solid var(--line); border-radius:16px 16px 4px 16px; padding:12px 16px;
  font-size:.82rem; font-weight:600; max-width:220px; box-shadow:var(--shadow-lg); color:var(--ink);
  opacity:0; transform:translateY(8px) scale(.95); pointer-events:none; transition:all .3s cubic-bezier(.22,1,.36,1);
}
.mascot-speech.show{opacity:1; transform:translateY(0) scale(1);}

/* ============ CONFETTI ============ */
.confetti-piece{position:fixed; top:-20px; z-index:200; border-radius:2px; pointer-events:none; animation:confettifall linear forwards;}
@keyframes confettifall{
  to{transform:translateY(110vh) rotate(540deg); opacity:.3;}
}

/* ============ MOBILE NAV DRAWER ============ */
.mobile-nav-overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:70; opacity:0; pointer-events:none; transition:opacity .3s;}
.mobile-nav-overlay.show{opacity:1; pointer-events:auto;}
.mobile-nav-panel{
  position:fixed; top:0; right:-320px; bottom:0; width:300px; background:var(--card); z-index:71;
  padding:24px; padding-top:calc(24px + env(safe-area-inset-top,0px)); transition:right .35s cubic-bezier(.22,1,.36,1);
  box-shadow:-10px 0 30px rgba(0,0,0,.15);
}
.mobile-nav-panel.show{right:0;}
.mobile-nav-panel a, .mobile-nav-panel button{
  display:block; width:100%; text-align:left; background:none; border:none; padding:12px 8px; font-weight:700;
  color:var(--ink); border-bottom:1px solid var(--line); font-size:.95rem;
}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--terracotta-soft); border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

@media (max-width:640px){
  .wrap{padding:0 18px;}
  .nav-progress{display:none;}
  .hero{padding:50px 18px 30px;}
  .stat-pill{min-width:100px; padding:12px 16px;}
  .assess-bar-label{width:150px; font-size:.76rem;}
}
</style>

<script id="course-data-json" type="application/json">{"courseTitle": "Full Stack Web Development", "courseSubtitle": "Your Complete Learning Path — Basic to Advanced", "welcome": {"intro": ["You're about to go from someone who's dabbled in code to someone who can build, secure, and ship a real web application on your own. This course is built in three stages — <strong>Basic → Intermediate → Advanced</strong> — and each stage ends with a real project you'll deploy live and add to your portfolio.", "---"], "walkAway": ["A live, deployed portfolio site (end of Stage 1)", "A full stack authenticated web app, live on the internet (end of Stage 2)", "A production-grade SaaS product you can demo and defend in an interview (end of Stage 3)", "Fluency in the exact tools real companies use: React, Node.js, PostgreSQL, Docker, and more"], "meta": ["<strong>How to use this course:</strong> Each lesson is built the same way — you'll see what you're learning and why it matters, a full explanation with real code, the mistakes almost everyone makes at your stage, something to build immediately to lock it in, your assignment, and a self-check before you move on. Don't skip the self-checks. If you can't answer them confidently, that's your signal to review before moving forward — not a test you pass or fail.", "<strong>Total length:</strong> 24 weeks | <strong>Time commitment:</strong> 8–10 hours/week | <strong>Stack you'll master:</strong> HTML5, CSS3, Tailwind, JavaScript, TypeScript, React, Next.js, Node.js, Express, PostgreSQL, MongoDB, GraphQL, Docker, AWS, and more.", "<strong>Before you start:</strong> Make sure you have VS Code, Node.js, and Git installed, and a GitHub account set up. If you haven't done this yet, pause here and complete the setup guide before Lesson 1."]}, "stages": [{"id": "stage1", "number": 1, "name": "Basic", "range": "Weeks 1–8", "subtitle": "Building Your Web Foundations", "blurb": "Master the real fundamentals: HTML, CSS, JavaScript, Git, and your dev environment.", "icon": "seed", "intro": "<p>By the end of this stage, you will have built and deployed a fully responsive, interactive personal website — entirely on your own, using real developer tools and workflow.</p>", "lessons": [{"number": 1, "title": "How the Web Actually Works", "whatYoullLearn": ["What happens, technically, between typing a URL and seeing a page", "The client-server model that underlies everything you'll build", "How to use your browser's developer tools like a professional"], "whyThisMatters": "<p>Every bug you'll ever debug as a web developer — a page that won't load, an API that returns the wrong data, a slow site — traces back to this request/response cycle. If you understand it deeply now, debugging later will feel like detective work instead of guesswork.</p>", "lessonContent": "<p>The internet is a network of networks — millions of computers connected through agreed-upon rules called protocols. When you type a URL into your browser, here's what happens in the milliseconds before the page appears:</p><ol><li>Your browser asks a <strong>DNS (Domain Name System)</strong> server to translate the human-readable domain (like <code>example.com</code>) into an IP address — the numeric address of the server hosting that site.</li><li>Your browser opens a connection to that server using <strong>HTTP</strong>, or more commonly today, <strong>HTTPS</strong> — the encrypted version, secured by <strong>TLS/SSL</strong>.</li><li>Your browser sends a <strong>request</strong> — essentially \"give me the homepage.\"</li><li>The server sends back a <strong>response</strong>: a status code (200 for success, 404 for not found, 500 for server error) plus the actual content — HTML, CSS, JavaScript, images.</li><li>Your browser <strong>renders</strong> that content into the page you see.</li></ol><p>This is the <strong>client-server model</strong>: your browser is the client, the machine serving files is the server. Everything you build in this course, at its core, is clients asking servers for things and servers answering.</p><p>You'll also use <strong>HTTP methods</strong> constantly from here forward: GET (retrieve data), POST (submit data), PUT/PATCH (update), DELETE (remove). And you'll rely on <strong>headers</strong> — <code>Content-Type</code> tells the receiver what format the data is in, <code>Authorization</code> carries credentials, <code>Cache-Control</code> says how long to store a response.</p><p>Your most important new tool this lesson: <strong>browser DevTools</strong> (right-click → Inspect, or F12). You'll live in four tabs constantly: <strong>Elements</strong> (inspect and live-edit HTML/CSS), <strong>Console</strong> (run JavaScript, see errors — this is where you'll spend the most time debugging), <strong>Network</strong> (watch every request and response happen in real time), and <strong>Application</strong> (inspect stored data).</p><p><strong>Going deeper: DNS, caching, and the protocols underneath</strong></p><p>DNS lookups aren't a single trip — they're a chain. Your computer asks a resolver (often your ISP's, or a public one like 1.1.1.1), which asks a root server, which points to a TLD server (like the one for <code>.com</code>), which points to the authoritative server for <code>example.com</code>. Every answer comes with a <strong>TTL (Time To Live)</strong>, so your browser and resolver cache it for a while instead of repeating this chain on every request — this is why DNS changes can take time to \"propagate.\"</p><p>You'll also hear about <strong>HTTP versions</strong>: HTTP/1.1 opens a new connection per request (slow), HTTP/2 multiplexes many requests over one connection (fast), and HTTP/3 goes further, running over a newer transport protocol (QUIC) that recovers from packet loss faster. You don't need to configure these yourself yet — most hosting platforms handle it — but knowing why \"HTTP/2 is faster\" matters will make you sound (and think) like an engineer, not just a coder.</p><p>Here's a quick-reference table of status codes worth memorizing now, since you'll see them constantly:</p><div class=\"table-wrap\"><table><thead><tr><th>Code</th><th>Meaning</th><th>You'll see it when...</th></tr></thead><tbody><tr><td>200</td><td>OK</td><td>A GET/PUT/PATCH request succeeded</td></tr><tr><td>201</td><td>Created</td><td>A POST successfully created something</td></tr><tr><td>204</td><td>No Content</td><td>Success, but nothing to send back (common on DELETE)</td></tr><tr><td>301/302</td><td>Redirect</td><td>The resource moved (permanently/temporarily)</td></tr><tr><td>400</td><td>Bad Request</td><td>Your request was malformed</td></tr><tr><td>401</td><td>Unauthorized</td><td>You're not logged in</td></tr><tr><td>403</td><td>Forbidden</td><td>You're logged in, but not allowed</td></tr><tr><td>404</td><td>Not Found</td><td>Wrong URL, or it doesn't exist</td></tr><tr><td>429</td><td>Too Many Requests</td><td>You got rate-limited</td></tr><tr><td>500</td><td>Internal Server Error</td><td>The server broke, not you</td></tr><tr><td>503</td><td>Service Unavailable</td><td>The server is overloaded or down for maintenance</td></tr></tbody></table></div>", "keyTerms": ["DNS", "IP address", "HTTP/HTTPS", "TLS/SSL", "client-server model", "status code", "request header", "response header", "latency", "bandwidth"], "mistakes": ["Confusing \"the internet\" with \"the web\" — the web is one application (among many, like email) that runs on the internet.", "Assuming HTTPS alone makes a site secure. It only protects data in transit — it says nothing about whether the application logic itself is secure.", "Skipping the Network tab when something \"just isn't working,\" and guessing instead of watching what's actually happening."], "tryItYourself": "<p>Open any live website right now. In the Network tab, find the status code of the homepage request, and identify 3 other resources it loaded (images, fonts, scripts). In the Elements tab, change a heading's text live and take a screenshot — you just edited a live webpage.</p>", "assignment": "<p>Write a one-page explanation, in your own words, of what happens between typing a URL and seeing a page — as if explaining it to a friend with no technical background. Use at least 3 of the key terms above, correctly.</p>", "checkYourself": ["Can you explain what DNS does without looking it up?", "Do you know which DevTools tab to open first when a page loads incorrectly?", "Can you name the difference between a request and a response?"], "goFurther": ["MDN Web Docs: \"How the Web Works\"", "Chrome DevTools official documentation", "freeCodeCamp: \"HTTP: The Protocol Every Web Developer Must Know\"", "web.dev's \"How Browsers Work\"", "Cloudflare Learning Center: \"What is DNS?\"", "High Performance Browser Networking (free online book, Ilya Grigorik)"]}, {"number": 2, "title": "Structuring Pages with Semantic HTML5", "whatYoullLearn": ["How to structure any webpage using proper, meaningful HTML5", "How to make your pages accessible to everyone, including people using screen readers", "How to write HTML that search engines understand"], "whyThisMatters": "<p>Semantic HTML is the difference between \"code that happens to look right\" and \"code a professional wrote.\" Recruiters, code reviewers, and automated accessibility scanners can all tell within seconds whether you understand this — and it's one of the fastest, cheapest ways to look (and be) more senior than you are.</p>", "lessonContent": "<p>HTML (HyperText Markup Language) is the skeleton of every webpage you'll ever build. Every element is a <strong>tag</strong> that tells the browser what kind of content it's dealing with. HTML5 gave you <strong>semantic elements</strong> — tags that describe <em>meaning</em>, not just appearance: <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;footer&gt;</code>. Using <code>&lt;div&gt;</code> for everything works visually, but tells the browser, screen readers, and search engines nothing about your page's structure.</p><p>Here's the document skeleton you'll start every project with:</p><pre class=\"code-block\" data-lang=\"html\"><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;UTF-8&quot;&gt;\n  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n  &lt;title&gt;Page Title&lt;/title&gt;\n  &lt;meta name=&quot;description&quot; content=&quot;A short, accurate page summary for search engines&quot;&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;header&gt;&lt;nav&gt;...&lt;/nav&gt;&lt;/header&gt;\n  &lt;main&gt;\n    &lt;section&gt;...&lt;/section&gt;\n  &lt;/main&gt;\n  &lt;footer&gt;...&lt;/footer&gt;\n&lt;/body&gt;\n&lt;/html&gt;</code></pre><p>You'll build forms constantly: <code>&lt;form&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;label&gt;</code>, <code>&lt;select&gt;</code>, <code>&lt;textarea&gt;</code>, <code>&lt;button&gt;</code>. Always pair <code>&lt;label for=\"email\"&gt;</code> with <code>&lt;input id=\"email\"&gt;</code> — this isn't optional polish, it's an accessibility requirement and something every interviewer checks for. Use <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> for lists, tables only for genuinely tabular data (never for layout), and <code>&lt;img&gt;</code> with meaningful <code>alt</code> text for every image that isn't purely decorative.</p><p><strong>Accessibility is not an extra — it's part of doing your job correctly.</strong> Learn the four WCAG principles: your content must be <strong>P</strong>erceivable, <strong>O</strong>perable, <strong>U</strong>nderstandable, and <strong>R</strong>obust (POUR). Write <code>alt</code> text that describes <em>purpose</em>, not just appearance (\"Company logo linking to homepage,\" not \"blue swirl image\"). Keep your heading hierarchy correct — one <code>&lt;h1&gt;</code> per page, and never skip a level (an <code>&lt;h2&gt;</code> should never jump straight to <code>&lt;h4&gt;</code>). Make sure every interactive element on your page can be reached and used with the Tab and Enter keys alone — unplug your mouse and try it.</p><p>While you're at it, add basic <strong>SEO</strong> habits: a meaningful <code>&lt;title&gt;</code>, an accurate meta description, and descriptive link text (never \"click here\").</p><p><strong>Going deeper: the full semantic toolkit and form inputs</strong></p><p>Beyond the big structural tags, know the smaller semantic elements that make a real difference: <code>&lt;time&gt;</code> (machine-readable dates), <code>&lt;mark&gt;</code> (highlighted text), <code>&lt;figure&gt;</code>/<code>&lt;figcaption&gt;</code> (an image with a caption, grouped meaningfully), <code>&lt;address&gt;</code> (contact info), and <code>&lt;details&gt;</code>/<code>&lt;summary&gt;</code> (a native, no-JavaScript-needed collapsible section — genuinely useful and often forgotten).</p><p>Forms deserve extra attention because they're where accessibility and usability collide most. <code>&lt;input&gt;</code> has a <code>type</code> attribute that does real work: <code>type=\"email\"</code> gives mobile users an @ key and basic validation for free; <code>type=\"tel\"</code>, <code>type=\"date\"</code>, <code>type=\"number\"</code>, and <code>type=\"url\"</code> all trigger the right keyboard and validation on mobile without a single line of JavaScript. Add <code>required</code>, <code>minlength</code>, <code>maxlength</code>, and <code>pattern</code> attributes for free client-side validation before you ever touch JS.</p><p>On ARIA: the first rule of ARIA is <em>don't use ARIA if a native HTML element already does the job</em>. A <code>&lt;button&gt;</code> is already keyboard-accessible and announced correctly by screen readers — a <code>&lt;div onclick=\"...\"&gt;</code> styled to look like a button is not, and requires you to manually add <code>role=\"button\"</code>, <code>tabindex=\"0\"</code>, and keyboard event handling to fix what you broke. Reach for ARIA attributes (<code>aria-label</code>, <code>aria-hidden</code>, <code>aria-live</code>, <code>role</code>) only when there's genuinely no native element for what you're building, like a custom dropdown or a live-updating notification area.</p>", "keyTerms": ["semantic HTML", "WCAG", "ARIA", "alt text", "heading hierarchy", "meta tags", "SEO"], "mistakes": ["Wrapping everything in <code>&lt;div&gt;</code> out of habit (\"div soup\") instead of reaching for the right semantic tag.", "Using <code>&lt;label&gt;</code> without correctly linking its <code>for</code> attribute to the input's <code>id</code>.", "Skipping heading levels purely because a smaller heading \"looks better\" — that's a CSS problem, not an HTML one.", "Adding <code>alt</code> text to purely decorative images (should be <code>alt=\"\"</code> so screen readers skip it)."], "tryItYourself": "<p>Take a poorly structured \"div soup\" page (your instructor will provide one) and convert it entirely to semantic HTML5, fixing the heading hierarchy and adding correct alt text throughout.</p>", "assignment": "<p>Build the static HTML skeleton (no CSS yet) of your own personal portfolio page: header with nav, hero section, about section, projects section, contact form, footer. Run it through a free accessibility checker (WAVE or axe) and fix everything it flags.</p>", "checkYourself": ["Could you explain to someone why <code>&lt;div&gt;</code> isn't always the right choice?", "Do you know what \"skipping a heading level\" means, and why it's a problem?", "Have you run your own page through an accessibility checker yet?"], "goFurther": ["MDN HTML reference", "WebAIM accessibility checklist", "WAVE accessibility evaluation tool (free browser extension)", "The A11Y Project (a11yproject.com)", "MDN ARIA reference", "HTML5 Doctor's element index"]}, {"number": 3, "title": "Styling with CSS3 — Flexbox, Grid & Responsive Design", "whatYoullLearn": ["The box model, and why nearly every layout bug traces back to it", "How to lay out pages with Flexbox and CSS Grid", "How to make any layout work beautifully on phone, tablet, and desktop"], "whyThisMatters": "<p>Most of the sites you'll ever build need to work on a phone screen and a 27-inch monitor equally well. This lesson gives you the actual tools professionals use to make that happen — not tricks, the real system.</p>", "lessonContent": "<p>CSS controls presentation. Start with the <strong>box model</strong>: every element has content, padding, border, and margin, in that order, and nearly every \"why is this overflowing\" bug comes from misunderstanding this. Set <code>box-sizing: border-box</code> on everything as a professional default — it makes width/height calculations behave the way you'd intuitively expect.</p><p><strong>Flexbox</strong> handles one-dimensional layout — a single row or column of items:</p><pre class=\"code-block\" data-lang=\"css\"><code>.card-row {\n  display: flex;\n  gap: 1rem;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  align-items: center;\n}</code></pre><p><strong>CSS Grid</strong> handles two-dimensional layout — rows and columns together:</p><pre class=\"code-block\" data-lang=\"css\"><code>.page-layout {\n  display: grid;\n  grid-template-columns: 250px 1fr;\n  grid-template-areas: &quot;sidebar main&quot;;\n  min-height: 100vh;\n}</code></pre><p>The rule of thumb you'll use for the rest of your career: <strong>Flexbox for a row or column of things</strong> (navbars, card rows, button groups); <strong>Grid for whole-page layouts</strong> (sidebar + main content, image galleries, dashboards).</p><p>Build <strong>mobile-first</strong>: style for the smallest screen first, then layer on complexity for bigger screens with <code>@media (min-width: ...)</code>. This is both easier and more robust than designing desktop-first and trying to squeeze it down later. Use relative units (<code>rem</code>, <code>%</code>, <code>vw</code>/<code>vh</code>) instead of fixed pixels so your layouts actually scale, and use <strong>CSS custom properties</strong> (variables) so your color scheme and spacing live in one place:</p><pre class=\"code-block\" data-lang=\"css\"><code>:root {\n  --primary-color: #2563eb;\n  --spacing-unit: 1rem;\n}\n.container { padding: var(--spacing-unit); }\n@media (min-width: 768px) {\n  .container { padding: calc(var(--spacing-unit) * 3); display: flex; }\n}</code></pre><p>Finally, add polish with <code>transition</code> for smooth hover/focus states and simple <code>@keyframes</code> animations — used purposefully, not decoratively. A subtle hover transition on a button is the kind of detail that quietly signals professionalism.</p><p><strong>Going deeper: how Flexbox and Grid actually distribute space</strong></p><p>Flexbox's real power is in three properties most beginners skip: <code>flex-grow</code> (how much an item expands into leftover space), <code>flex-shrink</code> (how much it shrinks when space is tight), and <code>flex-basis</code> (its starting size before growing/shrinking). The shorthand <code>flex: 1</code> actually means <code>flex-grow: 1; flex-shrink: 1; flex-basis: 0%</code> — which is why <code>flex: 1</code> on multiple items makes them split space evenly, while <code>flex: auto</code> respects their natural content size first.</p><p>Grid has an equally powerful trick: <code>repeat(auto-fit, minmax(200px, 1fr))</code> on <code>grid-template-columns</code> builds a fully responsive grid with <strong>zero media queries</strong> — it automatically fits as many 200px+ columns as will fit, and stretches them evenly. This single line replaces what used to take a dozen breakpoints.</p><p>One more thing worth understanding now, before it confuses you later: <strong>stacking context and <code>z-index</code></strong>. <code>z-index</code> only works on positioned elements (<code>relative</code>, <code>absolute</code>, <code>fixed</code>, or <code>sticky</code>) — setting it on a <code>static</code> element does nothing. And <code>z-index</code> values only compete <em>within the same stacking context</em>; a <code>z-index: 9999</code> element can still end up behind something with <code>z-index: 1</code> if they're in different stacking contexts (often created by <code>position</code>, <code>opacity &lt; 1</code>, or <code>transform</code>). If a <code>z-index</code> ever \"doesn't work,\" this is almost always why.</p>", "keyTerms": ["box model", "specificity", "cascade", "Flexbox", "CSS Grid", "mobile-first", "breakpoint", "CSS custom properties", "transition"], "mistakes": ["Reaching for <code>!important</code> to \"win\" a CSS fight instead of understanding specificity.", "Designing desktop-first, then fighting to retrofit mobile styles.", "Using fixed pixel widths that break the moment the screen gets smaller.", "Using Flexbox for something Grid would handle far more cleanly (a true 2D layout)."], "tryItYourself": "<p>Style your Lesson 2 portfolio skeleton with Flexbox/Grid to be fully responsive across phone, tablet, and desktop breakpoints. Add at least one hover transition somewhere.</p>", "assignment": "<p>Recreate a simple, real-world card-based layout (a 3-tier pricing table, from a provided design image), fully responsive, using CSS custom properties for your color scheme.</p>", "checkYourself": ["Can you explain, out loud, when you'd reach for Flexbox vs. Grid?", "Do you understand why mobile-first is usually easier than desktop-first?", "Does your portfolio look genuinely good on a phone-sized screen right now?"], "goFurther": ["CSS-Tricks: \"A Complete Guide to Flexbox\" and \"A Complete Guide to Grid\"", "\"Every Layout\" (free responsive design patterns book)", "web.dev CSS course", "Josh Comeau's \"An Interactive Guide to Flexbox\"", "Kevin Powell (YouTube, CSS deep dives)"]}, {"number": 4, "title": "Rapid Styling with Tailwind CSS", "whatYoullLearn": ["How utility-first CSS works, and why it's become an industry standard", "How to style components quickly without losing control of your design", "How to customize Tailwind so your work doesn't look like everyone else's"], "whyThisMatters": "<p>Most modern frontend job postings list Tailwind as a requirement. It's fast once you're fluent — but it can also produce forgettable, generic-looking output if you never customize it. This lesson teaches you to use it like a professional, not just a beginner copy-pasting class strings.</p>", "lessonContent": "<p>Utility-first CSS replaces custom class names with small, composable classes applied directly in your markup:</p><pre class=\"code-block\" data-lang=\"html\"><code>&lt;button class=&quot;px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition\n               dark:bg-blue-500 dark:hover:bg-blue-400&quot;&gt;\n  Get Started\n&lt;/button&gt;</code></pre><p>Here's the honest trade-off: Tailwind is fast and consistent because of its built-in design tokens (a fixed spacing scale, a fixed color palette), but it can look unreadable when you're new to it. That's exactly why you learned plain CSS first in Lesson 3 — <strong>you now understand what every one of these utility classes is actually doing underneath.</strong></p><p>Learn the spacing/sizing scale, responsive prefixes (<code>md:</code>, <code>lg:</code> — \"apply this style starting at this breakpoint\"), and state variants (<code>hover:</code>, <code>focus:</code>, <code>dark:</code>). When you find yourself repeating the same long utility string across many elements, extract it with <code>@apply</code> into a reusable class.</p><p>The step that actually separates a Tailwind beginner from someone using it professionally: <strong>customize the config.</strong> Extend the default color palette and spacing scale to match a real brand or personal identity, instead of shipping the default blue-and-gray look that every untouched Tailwind project has.</p><p><strong>Going deeper: arbitrary values and knowing when to walk away from utilities</strong></p><p>Tailwind's scale won't cover every exact value you need — that's what <strong>arbitrary values</strong> are for: <code>class=\"top-[117px] bg-[#1da1f2]\"</code> lets you drop in an exact value in square brackets when the design truly calls for it, without leaving Tailwind. Use this sparingly — reaching for it constantly is a sign your design isn't following a consistent scale.</p><p>Know the ecosystem plugins that ship as near-standard in real teams: <code>@tailwindcss/forms</code> (sane default form styling instead of fighting browser defaults), and <code>@tailwindcss/typography</code> (a <code>prose</code> class that beautifully styles raw HTML/Markdown content — genuinely useful for blog posts or docs pages where you don't control every tag).</p><p>And know when Tailwind is the wrong tool: highly complex, one-off animations; deeply nested pseudo-element styling; or a design system your team already maintains in plain CSS/Sass. Plain CSS and Tailwind aren't rivals — a professional codebase often uses Tailwind for 90% of layout and spacing, and drops to a <code>.css</code> file for the remaining 10% that's genuinely awkward as utility classes.</p>", "keyTerms": ["utility-first CSS", "design tokens", "responsive prefix", "state variant", "@apply", "Tailwind config"], "mistakes": ["Copy-pasting long utility strings without understanding what each class does — you lose the ability to debug or adjust it later.", "Never touching the default theme, so your project looks identical to every Tailwind tutorial online.", "Fighting Tailwind for a genuinely one-off, complex style instead of just dropping into plain CSS for that one case."], "tryItYourself": "<p>Rebuild your Lesson 3 pricing table using only Tailwind utility classes. Notice the speed difference — and the readability trade-off.</p>", "assignment": "<p>Fully restyle your portfolio project in Tailwind, and customize at least the color palette in the Tailwind config to reflect your personal brand — don't ship the default theme.</p>", "checkYourself": ["Could you explain to a beginner what a utility class actually does, underneath the abstraction?", "Have you changed anything in the Tailwind config, or are you still on the default theme?"], "goFurther": ["Tailwind CSS official documentation", "Tailwind UI (free component examples)", "Tailwind Play (playground)", "\"Refactoring UI\" (Adam Wathan & Steve Schoger)", "Tailwind CSS YouTube channel"]}, {"number": 5, "title": "JavaScript Fundamentals — Making Pages Interactive", "whatYoullLearn": ["Core JavaScript syntax and modern ES6+ features", "How to read and manipulate the DOM", "The basics of asynchronous code — your first look at talking to a server"], "whyThisMatters": "<p>Everything from here forward depends on this lesson. React, Node.js, every framework you'll ever touch — it's all JavaScript underneath. If something here feels shaky, this is the lesson worth re-reading before you move on.</p>", "lessonContent": "<p>Start with the fundamentals: variables (use <code>let</code> and <code>const</code> — never <code>var</code>, and you'll learn exactly why), data types, operators, conditionals, loops, and functions, including the arrow function syntax you'll use constantly:</p><pre class=\"code-block\" data-lang=\"js\"><code>const greetUser = (name) =&gt; `Hello, ${name}!`;\nconsole.log(greetUser(&quot;Sharon&quot;));</code></pre><p>Then meet the <strong>DOM (Document Object Model)</strong> — your browser's live, editable representation of the HTML page, as a tree of objects JavaScript can read and change:</p><pre class=\"code-block\" data-lang=\"js\"><code>const button = document.querySelector(&quot;#subscribe-btn&quot;);\nbutton.addEventListener(&quot;click&quot;, () =&gt; {\n  document.querySelector(&quot;#message&quot;).textContent = &quot;Subscribed!&quot;;\n});</code></pre><p>Arrays will be part of nearly everything you build. Learn <code>map</code>, <code>filter</code>, <code>reduce</code>, <code>forEach</code>, <code>find</code>, <code>some</code>, and <code>every</code> — not as syntax to memorize, but as genuinely different tools for genuinely different jobs:</p><pre class=\"code-block\" data-lang=\"js\"><code>const users = [{ name: &quot;Ada&quot;, active: true }, { name: &quot;Grace&quot;, active: false }];\nconst activeNames = users.filter(u =&gt; u.active).map(u =&gt; u.name);</code></pre><p>Learn destructuring, template literals, and spread/rest syntax — these show up in almost every modern codebase you'll ever read.</p><p>Then take your first real look at <strong>asynchronous</strong> code: JavaScript runs top to bottom, but a network request takes real time to come back, so your code has to be written to handle that gap.</p><pre class=\"code-block\" data-lang=\"js\"><code>fetch(&quot;https://api.example.com/users&quot;)\n  .then(response =&gt; response.json())\n  .then(data =&gt; console.log(data));</code></pre><p>Finally, learn <strong>event delegation</strong> — attaching one listener to a parent element instead of many listeners to many children, a real technique that matters for both performance and maintainability — and the difference between <code>preventDefault()</code>-requiring events like form <code>submit</code>, and simpler ones like <code>click</code>.</p><p><strong>Going deeper: hoisting, equality, and the gotchas that trip everyone up</strong></p><p><strong>Hoisting</strong> means <code>function</code> declarations and <code>var</code> variables are \"moved\" to the top of their scope before code runs — which is exactly why relying on it is dangerous and why you use <code>let</code>/<code>const</code> (which are hoisted too, but stay in a \"temporal dead zone\" and throw an error if used before declaration, instead of silently being <code>undefined</code>).</p><p>Always use <code>===</code> (strict equality) instead of <code>==</code> (loose equality). <code>==</code> performs type coercion before comparing, leading to surprises like <code>0 == \"0\"</code> being <code>true</code> while <code>0 === \"0\"</code> is correctly <code>false</code>. This single habit prevents an entire category of subtle bugs.</p><p>Learn <strong>truthy and falsy</strong> values now: <code>0</code>, <code>\"\"</code>, <code>null</code>, <code>undefined</code>, <code>NaN</code>, and <code>false</code> are all falsy; <em>everything else</em> — including <code>\"0\"</code> (a string!) and <code>[]</code> (an empty array!) — is truthy. This explains why <code>if (myArray)</code> is almost always true even for an empty array, and why you should check <code>myArray.length</code> instead.</p><p>A quick-reference for array methods you'll reach for daily:</p><pre class=\"code-block\" data-lang=\"js\"><code>[1,2,3].map(x =&gt; x * 2)        // [2,4,6] — transform each item\n[1,2,3].filter(x =&gt; x &gt; 1)     // [2,3]   — keep matching items\n[1,2,3].reduce((a,b) =&gt; a+b)   // 6       — combine into one value\n[1,2,3].find(x =&gt; x &gt; 1)       // 2       — first match, or undefined\n[1,2,3].some(x =&gt; x &gt; 2)       // true    — does any item match?\n[1,2,3].every(x =&gt; x &gt; 0)      // true    — do all items match?</code></pre>", "keyTerms": ["DOM", "event listener", "event delegation", "Promise", "callback", "fetch", "template literal", "destructuring", "spread/rest"], "mistakes": ["Manipulating the DOM directly for every small UI change, instead of starting to think in terms of \"what state changed\" — this mental shift is exactly what Lesson 10 (React) will formalize.", "Forgetting <code>preventDefault()</code> on form submissions, causing an unwanted full page reload.", "Falling back to <code>var</code> out of old habit, and getting bitten by scope bugs as a result.", "Calling <code>fetch()</code> with no error handling at all — if the network fails, your app silently breaks."], "tryItYourself": "<p>Build an interactive to-do list: add items, mark complete, delete items — pure JavaScript and DOM manipulation, no frameworks yet. Use event delegation for the delete buttons.</p>", "assignment": "<p>Add a working contact form to your portfolio that validates input (non-empty fields, valid email format) using JavaScript before \"submitting\" (logging to console is fine for now).</p>", "checkYourself": ["Can you explain what the DOM is to someone who's never coded?", "Do you understand why <code>fetch()</code> needs <code>.then()</code> (or <code>await</code>, which you'll meet next lesson) instead of just returning data directly?", "Could you rebuild the to-do list activity from scratch, without looking at your notes?"], "goFurther": ["MDN JavaScript Guide", "javascript.info (Parts 1–2)", "\"Eloquent JavaScript\" (free online book, Ch. 1–4 for extra depth)", "javascript.info (full site, not just async)", "Fun Fun Function (YouTube archive)", "\"You Don't Know JS\" (free book series, Kyle Simpson)"]}, {"number": 6, "title": "Version Control — Git & GitHub", "whatYoullLearn": ["How to track your project's history with Git so you never lose work", "The exact branching and pull request workflow real engineering teams use", "How to collaborate on code without stepping on someone else's work"], "whyThisMatters": "<p>You will use Git every single day of your career, without exception. Every employer expects fluency here on day one — it's not a \"nice to have,\" it's the baseline.</p>", "lessonContent": "<p>Git is a <strong>version control system</strong>: it records snapshots (commits) of your project over time, so nothing is ever truly lost, and you (or a team) can work on the same codebase without overwriting each other's changes. GitHub hosts your Git repositories in the cloud and adds collaboration tools on top.</p><p>Your core everyday workflow:</p><pre class=\"code-block\" data-lang=\"bash\"><code>git init\ngit add .\ngit commit -m &quot;Initial commit&quot;\ngit remote add origin &lt;repo-url&gt;\ngit push -u origin main</code></pre><p>Here's the habit that matters most: <strong>never work directly on <code>main</code> for real projects.</strong> Create a feature branch, make your changes, commit, push, and open a <strong>pull request (PR)</strong> for review before merging. This is exactly how professional teams work, and it's exactly what interviewers expect fluency in.</p><pre class=\"code-block\" data-lang=\"bash\"><code>git checkout -b feature/contact-form\ngit add .\ngit commit -m &quot;Add contact form validation&quot;\ngit push origin feature/contact-form</code></pre><p>You'll eventually hit a <strong>merge conflict</strong> — Git telling you it can't automatically combine two changes. Don't panic; read the conflict markers calmly and choose (or combine) the correct version. Set up a <code>.gitignore</code> from the start of every project so you never accidentally commit things like <code>node_modules</code>. Write commit messages in the imperative mood (\"Add,\" not \"Added\" or \"Adding\"), and consider adopting <strong>Conventional Commits</strong> (<code>feat:</code>, <code>fix:</code>, <code>chore:</code>, <code>docs:</code>) — a format many real teams standardize on.</p><p>A few more commands worth knowing early: <code>git stash</code> to temporarily shelve unfinished changes, <code>git log --oneline</code> for a readable history, <code>git diff</code> to see exactly what changed before you commit, and <code>git revert</code> (safely undoes by adding a new commit) vs. <code>git reset</code> (rewrites history — risky on a shared branch).</p><p><strong>Going deeper: rebase, tags, and the two workflows real teams use</strong></p><p><code>git merge</code> and <code>git rebase</code> both combine changes, but differently. <code>merge</code> creates a new \"merge commit\" that ties two branches' histories together, preserving exactly what happened. <code>rebase</code> replays your branch's commits on top of the latest <code>main</code>, producing a clean, linear history — but it rewrites commit history, so the rule is: <strong>never rebase a branch other people are also working on.</strong> Many teams rebase their own feature branch before opening a PR (for a clean history) but always merge (never rebase) when combining branches that are shared.</p><p>Learn <strong>tags</strong> for marking release points: <code>git tag v1.0.0</code> marks the exact commit a version was released from, so you can always check out precisely what shipped.</p><p>Two workflows you'll hear named: <strong>GitHub Flow</strong> (simple — <code>main</code> is always deployable, every change is a short-lived feature branch merged via PR) is what most modern web teams use. <strong>Git Flow</strong> (more structured — separate <code>develop</code>, <code>release</code>, and <code>hotfix</code> branches) shows up more in software with scheduled releases, like mobile apps or enterprise software. For the fast-moving web projects in this course, GitHub Flow is what you'll actually use.</p>", "keyTerms": ["repository", "commit", "branch", "pull request", "merge conflict", ".gitignore", "Conventional Commits"], "mistakes": ["Committing straight to <code>main</code> out of habit.", "Vague commit messages like \"fixed stuff\" or \"update\" that tell a future reader (often you) nothing.", "Committing <code>node_modules</code> or <code>.env</code> files because <code>.gitignore</code> wasn't set up first.", "Panicking during a merge conflict and force-pushing over a shared branch — this can destroy a teammate's work."], "tryItYourself": "<p>Pair up with a classmate: one of you creates a repo and adds the other as a collaborator. Each of you creates a branch, makes a change, opens a PR, and leaves at least one review comment on the other's PR before merging.</p>", "assignment": "<p>Push your portfolio project to GitHub with a clean commit history (no \"final final v2\" messages) and a proper <code>README.md</code> describing the project.</p>", "checkYourself": ["Could you resolve a merge conflict right now without instructor help?", "Do you know the difference between <code>git revert</code> and <code>git reset</code>, and when each is safe to use?", "Is your portfolio repo's commit history something you'd be comfortable showing an interviewer?"], "goFurther": ["GitHub's \"Git Handbook\"", "Atlassian Git branching tutorial", "Conventional Commits specification (conventionalcommits.org)", "Learn Git Branching (interactive, learngitbranching.js.org)", "Oh Shit, Git!?! (plain-English fixes for common mistakes)", "GitHub Skills (free interactive courses)"]}, {"number": 7, "title": "The Command Line & Your Dev Environment", "whatYoullLearn": ["Core terminal commands you'll use every day", "How to set up a professional local development environment", "Why secrets never belong in your source code"], "whyThisMatters": "<p>Professional developers live in the terminal — it's faster and more powerful than clicking through folders. Getting comfortable here now saves you real time for the rest of the course, and the rest of your career.</p>", "lessonContent": "<p>Learn the core commands: <code>pwd</code> (where am I), <code>ls</code> (what's here), <code>cd</code> (move around), <code>mkdir</code>/<code>touch</code> (create folders/files), <code>rm</code>/<code>mv</code>/<code>cp</code> (remove/move/copy), and piping (<code>|</code>) to chain commands together. Most importantly, practice reading error output calmly instead of panicking — the terminal is usually telling you exactly what went wrong, in plain text, if you read it.</p><p>Get familiar with <code>npm</code> and <code>npx</code>, and understand what <code>node_modules</code> and <code>package.json</code> actually are. Note <code>package-lock.json</code> specifically — it locks exact dependency versions so every machine running your project gets identical behavior, which is exactly why it gets committed to Git alongside your code.</p><p>Set up your professional toolkit: VS Code with Prettier (auto-formatting), ESLint (catching errors and style issues before they become bugs), GitLens (Git history right inside your editor), and Live Server (instant local previews). Install <code>nvm</code> to manage multiple Node.js versions cleanly, since different projects sometimes need different versions.</p><p>Introduce yourself to <strong>environment variables</strong> and <code>.env</code> files now, conceptually — this is why secrets like API keys and database URLs never get hardcoded into your source code. You'll use this constantly starting in Stage 2. And learn <code>npm scripts</code> in <code>package.json</code> — the standard way real projects define repeatable commands like <code>npm run dev</code> or <code>npm test</code>.</p><p><strong>Going deeper: package managers and the tools that keep a team in sync</strong></p><p>You'll hear about three package managers: <code>npm</code> (comes with Node, the default), <code>yarn</code> (Facebook's alternative, historically faster, now roughly at parity), and <code>pnpm</code> (uses disk space far more efficiently by sharing packages across projects — increasingly popular on real teams). Pick whichever your team uses; the commands are nearly identical (<code>npm install</code> ≈ <code>yarn add</code> ≈ <code>pnpm add</code>).</p><p>Add an <code>.editorconfig</code> file to every project — a tiny, universal config (indent size, line endings, charset) that every major editor respects automatically, so a team never argues about tabs vs. spaces again.</p><p>Commands worth having memorized:</p><pre class=\"code-block\" data-lang=\"bash\"><code>npm install            # install everything in package.json\nnpm install axios       # add a new dependency\nnpm install -D vitest   # add a dev-only dependency (testing, tooling)\nnpm uninstall axios      # remove a dependency\nnpm run dev              # run whatever &quot;dev&quot; script is defined\nnpm outdated              # see which dependencies have newer versions\nnpm audit                  # check for known security vulnerabilities</code></pre>", "keyTerms": ["package manager", "package.json", "package-lock.json", "node_modules", "environment variable", ".env", "npm script"], "mistakes": ["Installing packages globally when a project-local install (with a lockfile) is what actually keeps a team's environments in sync.", "Committing a <code>.env</code> file to Git — this is a real, common cause of leaked credentials.", "Ignoring linter/formatter warnings instead of letting the editor auto-fix them for you.", "Avoiding the terminal in favor of a GUI file explorer, and losing real speed as a result."], "tryItYourself": "<p>Set up a brand-new project entirely from the terminal — folder structure, <code>git init</code>, <code>npm init</code>, installing a package, opening it in VS Code — without touching a GUI file explorer once.</p>", "assignment": "<p>Write a short personal onboarding guide documenting your dev environment setup (OS, tools, extensions, terminal config) — as if you were handing your exact setup instructions to a new hire on day one.</p>", "checkYourself": ["Can you navigate an entire new project from the terminal without opening a file explorer?", "Do you understand why <code>.env</code> files should never be committed to Git?"], "goFurther": ["\"The Missing Semester of Your CS Education\" (MIT, command line lecture, free)", "nvm official documentation", "explainshell.com (paste any command, see it explained)", "Node.js official docs", "oh-my-zsh (popular terminal customization)"]}, {"number": 8, "title": "Web Performance & Accessibility — A Pre-Launch Habit", "whatYoullLearn": ["The metrics real companies use to judge whether your site actually feels fast", "A repeatable accessibility check you'll run before every project you ever ship"], "whyThisMatters": "<p>Building something that works is only half the job. Building something fast and usable for everyone — including people on slow connections or using assistive technology — is what separates a portfolio piece from something a company would actually put in front of real users.</p>", "lessonContent": "<p>Meet <strong>Core Web Vitals</strong> — the metrics the industry (and Google) uses to judge real user experience: <strong>LCP</strong> (Largest Contentful Paint — how fast your main content appears), <strong>CLS</strong> (Cumulative Layout Shift — how much your page jumps around while loading, usually caused by images with no set dimensions), and <strong>INP</strong> (Interaction to Next Paint — how responsive your page feels to clicks and taps).</p><p>You can improve all three with a handful of habits: compress and correctly size your images, add <code>loading=\"lazy\"</code> to below-the-fold images, minimize render-blocking CSS/JS, and — most importantly — actually run <strong>Lighthouse</strong> (built into Chrome DevTools) on your own pages. It gives you a concrete score and a specific, actionable list of fixes.</p><p>Build a <strong>pre-launch accessibility checklist</strong> you'll run on every project from now on: unplug your mouse and navigate the whole page with Tab and Enter only; check that your text meets WCAG AA color contrast ratios; spot-check with a screen reader if you can; and run a Lighthouse accessibility audit.</p><p><strong>Going deeper: image formats, bundling, and real screen-reader basics</strong></p><p>Not all image formats are equal. <strong>WebP</strong> and the newer <strong>AVIF</strong> compress dramatically better than JPEG/PNG at equivalent quality — serving these formats (with a fallback) is often the single biggest Core Web Vitals win available, and modern build tools can do this automatically. For truly critical above-the-fold images, <code>&lt;link rel=\"preload\"&gt;</code> tells the browser to fetch them immediately instead of discovering them late.</p><p>Understand <strong>bundling and minification</strong> conceptually: a bundler (Vite, Webpack) combines your many JS/CSS files into fewer, optimized files, and a minifier strips whitespace/comments and shortens variable names to shrink file size — both happen automatically in any modern framework's build step, but knowing what's happening helps you debug a slow build.</p><p>For a real (not performative) accessibility check: learn the basics of VoiceOver (Mac, Cmd+F5) or NVDA (Windows, free) and navigate your own site with your eyes closed for five minutes. It's genuinely humbling the first time, and it's the fastest way to internalize why heading structure and alt text aren't optional. Know the key <strong>ARIA landmark roles</strong> too: <code>banner</code> (header), <code>navigation</code>, <code>main</code>, <code>contentinfo</code> (footer), <code>search</code> — screen reader users often jump directly between landmarks instead of reading top to bottom.</p>", "keyTerms": ["Core Web Vitals", "LCP", "CLS", "INP", "Lighthouse", "lazy loading", "contrast ratio"], "mistakes": [], "tryItYourself": "<p>Run a Lighthouse audit on your portfolio project right now. Fix the top 3 flagged performance issues and top 3 accessibility issues, then re-run it and see your score improve.</p>", "assignment": "<p>Write a short before/after report with your Lighthouse scores and a plain-language explanation of each fix you applied.</p>", "checkYourself": ["Do you know what LCP, CLS, and INP each measure, in your own words?", "Can you navigate your entire portfolio site using only the keyboard?"], "goFurther": ["web.dev (Google's official Core Web Vitals documentation)", "Lighthouse documentation", "web.dev Learn Performance course", "Deque University (accessibility training)", "Can I Use (caniuse.com, browser support reference)"]}], "project": {"lead": "A fully responsive personal portfolio website that includes:", "build": ["Semantic, accessible HTML5 structure (Lesson 2)", "A fully responsive layout using Flexbox/Grid or Tailwind (Lessons 3–4)", "At least one real interactive JavaScript feature (Lesson 5) — a working filter, a dark mode toggle, or similar", "A working, validated contact form", "Clean Git history with meaningful commits and a proper README (Lesson 6)", "A passing Lighthouse performance and accessibility audit (Lesson 8)", "A live deployment (Vercel, Netlify, or GitHub Pages) with a shareable link"], "assess": "Semantic correctness &amp; accessibility (20%) · Responsive design quality (20%) · JavaScript interactivity (20%) · Code organization &amp; Git hygiene (20%) · Deployment, performance &amp; polish (20%)", "extra": "<p>Get your project reviewed by a peer and your instructor. This is a checkpoint, not a gate to fear — the feedback here is what makes Stage 2 click faster.</p>", "title": "Your Responsive Portfolio Website"}}, {"id": "stage2", "number": 2, "name": "Intermediate", "range": "Weeks 9–16", "subtitle": "Building Real, Full Stack Applications", "blurb": "React, Node.js, databases, authentication — your first real full stack product.", "icon": "sprout", "intro": "<p>By the end of this stage, you will have built and deployed a complete, authenticated, database-backed full stack application — a genuine SaaS-style product, not a tutorial clone.</p>", "lessons": [{"number": 9, "title": "Advanced JavaScript — Async/Await & Closures", "whatYoullLearn": ["How to write clean asynchronous code with async/await", "What closures actually are, and why they matter for everything coming next", "How to handle errors like a professional, not an afterthought"], "whyThisMatters": "<p>React (your very next lesson) leans on closures constantly, often invisibly. Understanding them now means React's hooks will make sense instead of feeling like magic.</p>", "lessonContent": "<p>A <strong>closure</strong> is a function that \"remembers\" the variables from where it was created, even after that outer function has already finished running:</p><pre class=\"code-block\" data-lang=\"js\"><code>function createCounter() {\n  let count = 0;\n  return () =&gt; ++count;\n}\nconst counter = createCounter();\ncounter(); // 1\ncounter(); // 2</code></pre><p>You met Promises briefly in Lesson 5. Now formalize them: a Promise is either pending, fulfilled, or rejected, and <code>async</code>/<code>await</code> is the modern, readable way to work with them:</p><pre class=\"code-block\" data-lang=\"js\"><code>async function getUser(id) {\n  try {\n    const response = await fetch(`/api/users/${id}`);\n    if (!response.ok) throw new Error(&quot;Failed to fetch user&quot;);\n    return await response.json();\n  } catch (error) {\n    console.error(&quot;Error fetching user:&quot;, error.message);\n  }\n}</code></pre><p>Learn <code>Promise.all()</code> for running multiple async operations at once, and <code>Promise.allSettled()</code> for when you need to handle partial failures gracefully rather than letting one failure sink everything.</p><p>Finally, get a working mental model of the <strong>event loop</strong> — why JavaScript is single-threaded, yet never blocks on a slow network request. This is what explains the \"weird\" behaviors you'll eventually hit, like why <code>setTimeout(fn, 0)</code> doesn't run instantly.</p><p><strong>Going deeper: the microtask queue, and where Promises actually run</strong></p><p>The event loop has two queues, and the distinction matters: the <strong>microtask queue</strong> (Promise callbacks, <code>async</code>/<code>await</code> continuations) and the <strong>macrotask/callback queue</strong> (<code>setTimeout</code>, UI events, I/O). After every single task, JavaScript drains the <em>entire</em> microtask queue before touching the next macrotask — this is why a resolved Promise's <code>.then()</code> runs before a <code>setTimeout(fn, 0)</code>, even though both look \"instant.\"</p><pre class=\"code-block\" data-lang=\"js\"><code>console.log(&quot;1&quot;);\nsetTimeout(() =&gt; console.log(&quot;2&quot;), 0);\nPromise.resolve().then(() =&gt; console.log(&quot;3&quot;));\nconsole.log(&quot;4&quot;);\n// Output: 1, 4, 3, 2 — microtasks (Promises) always win the race</code></pre><p>You don't need to master this to be productive, but the moment async code behaves \"unexpectedly,\" this ordering is usually why. Later, when you meet React error boundaries and Suspense, this same event loop model is what makes them work.</p>", "keyTerms": ["closure", "Promise", "async/await", "event loop", "Promise.all", "Promise.allSettled"], "mistakes": ["Mixing <code>.then()</code> chains and <code>async/await</code> in the same function, making the code hard to follow.", "Forgetting <code>await</code>, and ending up with a Promise object instead of the actual resolved value.", "Using <code>Promise.all()</code> when one failure shouldn't sink the whole batch — that's what <code>Promise.allSettled()</code> is for."], "tryItYourself": "<p>Build a small \"weather dashboard\" that fetches data from a free public API, handles loading and error states, and displays results — using async/await throughout, no <code>.then()</code> chains at all.</p>", "assignment": "<p>Go back to any <code>.then()</code> chains in your Stage 1 projects and refactor them into async/await with proper try/catch error handling.</p>", "checkYourself": ["Could you explain a closure to someone with a simple example, without looking anything up?", "Do you know when to reach for <code>Promise.all()</code> vs. <code>Promise.allSettled()</code>?"], "goFurther": ["javascript.info (Promises, async/await chapters)", "\"What the heck is the event loop anyway?\" (Philip Roberts, JSConf talk, free on YouTube)", "Jake Archibald's \"In The Loop\" (JSConf talk on the event loop, deep dive)", "MDN Concurrency model docs", "Node.js Event Loop official guide"]}, {"number": 10, "title": "React Fundamentals", "whatYoullLearn": ["How to build UIs out of reusable components", "How to manage state and side effects with hooks", "How to navigate between pages without full reloads"],
